# Unggah halaman depan ariba.id ke hosting DirectAdmin (public_html) lewat FTP/FTPS.
#
# Aman untuk aplikasi lain di hosting yang sama (Kasbon, Jembara, dll.):
# - Hanya file di repositori ini yang diunggah atau diganti.
# - Action ini menyimpan daftar file yang pernah diunggahnya (.ftp-deploy-sync-state.json)
#   dan hanya menghapus file dari daftar itu. Folder lain di public_html tidak disentuh.
# - Tidak ada .htaccess di akar, jadi aturan server untuk subfolder lain tidak berubah.
#
# Pengaturan (Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER   mis. ftp.ariba.id
#              FTP_USERNAME mis. web@ariba.id
#              FTP_PASSWORD
#   Variables: FTP_DIR      folder tujuan relatif terhadap akun FTP (bawaan: public_html/).
#                           Akun deploy@ariba.id (path /home/attaqwac/domains/ariba.id/) → "public_html/" (bawaan)
#                           Akun utama attaqwac → "domains/ariba.id/public_html/"
#              FTP_PROTOCOL ftps (bawaan) atau ftp bila server tidak mendukung TLS
name: Deploy ke ariba.id

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ariba-id
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Periksa pengaturan FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing. Isi di Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Unggah ke public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md

      # DirectAdmin menyajikan https:// dari private_html. Biasanya itu symlink ke public_html
      # (langkah ini lalu tidak mengubah apa pun); bila folder terpisah, situs juga diunggah ke sana.
      - name: Unggah ke private_html (https)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR_HTTPS || 'private_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
