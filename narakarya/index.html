  const P = NK.pol(), S = NK.S, q = qFor(5000000, 'Desain & Kreatif', null, null);
  const counts = Object.fromEntries(NK.CATS.map((c) => [c, S.jobs.filter((j) => j.cat === c && j.status === 'TERBUKA').length + talents().filter((u) => u.cat === c).length]));
  return `<section class="hero"><div class="wrap"><div>
    <h1>Kerja lepas yang dibayar adil, tanpa bunga dan tanpa denda.</h1>
    <p class="lead">Temukan freelancer tepercaya atau pekerjaan berikutnya. Dana klien ditahan aman sampai hasil disetujui, dan setiap biaya tertulis sejak awal.</p>
    <form class="searchbox" data-f="hsearch"><select id="hs-t" name="t" aria-label="Yang dicari"><option value="talenta">Talenta</option><option value="lowongan">Lowongan</option><option value="jasa">Jasa</option></select><input id="hs-q" name="q" placeholder="Contoh: pembukuan koperasi, desain kemasan" aria-label="Kata kunci"><button class="btn pri">${ic('search')} Cari</button></form>
    <div class="chips"><span>Sering dicari:</span><a href="#talenta" data-cat="Akuntansi & Pajak">Pembukuan</a><a href="#talenta" data-cat="Desain & Kreatif">Desain kemasan</a><a href="#talenta" data-cat="Web & Aplikasi">Toko daring</a><a href="#talenta" data-cat="Hukum & Perizinan">Perizinan</a></div>
  </div>
  <aside class="nota" aria-label="Contoh rincian kontrak">
    <div class="no">CONTOH NOTA KONTRAK · DESAIN &amp; KREATIF</div><h3>Desain identitas merek</h3>
    <div class="lines">${cLines(q)}</div><div class="lines" style="margin-top:8px">${fLines(q).replace('<div><span>Harga</span><span>' + rp(q.amount) + '</span></div>', '')}</div>
    <p class="xs muted" style="margin-top:8px">Akun umum. Anggota koperasi ARIBA membayar biaya layanan lebih rendah.</p>
  </aside></div></section>
  <section class="band"><div class="wrap"><div class="sect-h"><h2>Telusuri kategori</h2></div><div class="catlist">${NK.CATS.map((c) => `<a href="#talenta" data-cat="${esc(c)}">${esc(c)} <span>${counts[c]}</span></a>`).join('')}</div></div></section>
  <section class="band alt"><div class="wrap"><div class="sect-h"><h2>Lowongan terbaru</h2><a href="#lowongan">Lihat semua lowongan</a></div><div class="grid2">${openJobs().slice(0, 4).map(jobCard).join('')}</div></div></section>
  <section class="band"><div class="wrap"><div class="sect-h"><h2>Talenta peringkat teratas</h2><a href="#peringkat">Lihat peringkat</a></div><div class="grid4">${sortTalents(talents()).slice(0, 4).map(talentCard).join('')}</div></div></section>
  <section class="band alt"><div class="wrap"><div class="sect-h"><h2>Cara kerjanya</h2></div><div class="steps">
    <div><h3>Pasang atau pesan</h3><p class="muted">Pemberi kerja memasang lowongan gratis atau memesan jasa siap pakai.</p></div>
    <div><h3>Lamar dan interview</h3><p class="muted">Freelancer melamar dengan kredit. Pemberi kerja mengajak interview di ruang percakapan yang diawasi Ariba.</p></div>
    <div><h3>Dana ditahan</h3><p class="muted">Pekerjaan dibagi menjadi termin. Dana termin ditahan dan progres kerja dilaporkan berkala.</p></div>
    <div><h3>Setujui, dana cair</h3><p class="muted">Hasil disetujui, dana cair. Bila pemberi kerja diam ${P.autoReleaseDays} hari, dana cair otomatis.</p></div></div></div></section>
  <section class="band dark"><div class="wrap"><div class="sect-h"><h2>Lebih untung bagi anggota koperasi ARIBA</h2><a href="#harga" style="color:#fff">Lihat perbandingan</a></div>
    <p style="color:#FBE3E6;max-width:70ch;margin-bottom:18px">Berlaku untuk anggota semua koperasi yang memakai ARIBA, termasuk Koperasi Desa dan Kelurahan Merah Putih.</p><div class="grid4">
    ${[[`Biaya layanan −${P.memberFeeDiscount} poin`, `Pemberi kerja anggota membayar ${pc(P.cFeeMember)}, bukan ${pc(P.cFeePublic)}.`], [`${P.freeCreditsMember} kredit gratis tiap bulan`, `Tiga kali akun umum, ditambah bonus ${P.memberPackBonusPct}% di setiap paket kredit.`], [`Plus hanya ${rp(P.plusPriceMember)}`, `Akun umum ${rp(P.plusPricePublic)} per bulan, keduanya berisi ${P.plusCredits} kredit.`], ['Cair ke Dompet ARIBA', 'Gratis, tanpa masa tunggu, dan identitas terverifikasi otomatis.']].map(([a, b]) => `<div><h3 style="color:#fff;font-size:18px">${a}</h3><p style="color:#FBE3E6;font-size:14px;margin-top:4px">${b}</p></div>`).join('')}
  </div></div></section>`;
}

/* ---------- daftar publik ---------- */
const filterBar = (extra = '') => `<form class="card fgrid x4" data-f="filter" style="align-items:end"><label class="f span2">Kata kunci<input class="in" id="fl-q" name="q" value="${esc(filt.q)}" placeholder="Cari"></label><label class="f">Kategori<select class="in" id="fl-cat" name="cat" data-submit><option value="">Semua kategori</option>${NK.CATS.map((c) => `<option ${c === filt.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>${extra}<button hidden>Cari</button></form>`;
const hit = (t) => !filt.q || t.toLowerCase().includes(filt.q.toLowerCase());
function vJobs() {
  const u = NK.me();
  const list = openJobs().filter((j) => (!filt.cat || j.cat === filt.cat) && (!filt.budget || j.budget >= filt.budget) && (!filt.pay || NK.payVerified(NK.user(j.clientId))) && hit([j.title, j.desc, j.skills.join(' ')].join(' ')));
  return `<div class="wrap page stack"><div class="row between"><div><h1 class="title">Cari kerja</h1><p class="muted">${list.length} lowongan terbuka${u && u.kind === 'F' ? ` · sisa kredit Anda ${NK.credits(u.id).total}` : ''}</p></div>${u && u.kind === 'K' ? `<a class="btn pri" href="#pasang">${ic('plus')} Pasang lowongan</a>` : ''}</div>
  ${filterBar(`<label class="f">Anggaran minimal<select class="in" id="fl-b" name="budget" data-submit>${[0, 1000000, 3000000, 10000000].map((v) => `<option value="${v}" ${filt.budget === v ? 'selected' : ''}>${v ? rp(v) : 'Semua'}</option>`).join('')}</select></label><label class="f span2">Pemberi kerja<select class="in" id="fl-p" name="pay" data-submit><option value="">Semua</option><option value="1" ${filt.pay ? 'selected' : ''}>Pembayaran terverifikasi saja</option></select></label>`)}
  ${list.length ? `<div class="grid2">${list.map(jobCard).join('')}</div>` : empty('Tidak ada lowongan yang cocok', 'Coba kata kunci lain atau hapus filter kategori.')}</div>`;
}
function vTalents() {
  const list = sortTalents(talents()).filter((u) => (!filt.cat || u.cat === filt.cat) && (!filt.member || NK.isMember(u)) && hit([u.name, u.headline, u.skills.join(' '), u.bio].join(' ')));
  return `<div class="wrap page stack"><div><h1 class="title">Cari talenta</h1><p class="muted">${list.length} freelancer, diurutkan menurut skor peringkat. Saat skornya sama, anggota koperasi ARIBA tampil lebih dulu.</p></div>
  ${filterBar(`<label class="f">Keanggotaan<select class="in" id="fl-m" name="member" data-submit><option value="">Semua</option><option value="1" ${filt.member ? 'selected' : ''}>Anggota koperasi ARIBA</option></select></label>`)}
  ${list.length ? `<div class="grid3">${list.map(talentCard).join('')}</div>` : empty('Tidak ada talenta yang cocok', 'Coba kata kunci lain atau hapus filter.')}</div>`;
}
function vServices() {
  const list = liveServices().filter((s) => (!filt.cat || s.cat === filt.cat) && hit(s.title + ' ' + s.desc));
  return `<div class="wrap page stack"><div><h1 class="title">Jasa siap pesan</h1><p class="muted">Harga dan isi paket sudah pasti. Pesan, danai, selesai.</p></div>${filterBar()}${list.length ? `<div class="grid3">${list.map(serviceCard).join('')}</div>` : empty('Tidak ada jasa yang cocok')}</div>`;
}

function vJob(id) {
  const j = NK.S.jobs.find((x) => x.id === id); const u = NK.me();
  if (!j || (j.status !== 'TERBUKA' && !(u && (u.id === j.clientId || u.role === 'ADMIN')))) return `<div class="wrap page">${empty('Lowongan tidak ditemukan', '<a href="#lowongan">Kembali ke daftar lowongan</a>')}</div>`;
  const c = NK.user(j.clientId), mine = u && u.id === j.clientId, cr = NK.rankOf(c.id);
  const props = NK.S.proposals.filter((p) => p.jobId === j.id && p.status !== 'DITARIK');
  const sent = u && NK.S.proposals.find((p) => p.jobId === j.id && p.freelancerId === u.id && p.status !== 'DITARIK');
  let act;
  if (mine) act = `<h2 class="h2s">Proposal masuk (${props.length})</h2>${props.length ? props.map((p) => proposalRow(p, j)).join('') : empty('Belum ada proposal')}`;
  else if (sent) { const t = NK.S.threads.find((x) => x.proposalId === sent.id); act = `<div class="note sea">Proposal Anda ${rp(sent.price)} terkirim ${ago(sent.at)} dengan ${sent.credits.free + sent.credits.paid} kredit.${t ? ` <a href="#pesan-${t.id}">Buka ruang interview</a>` : ''}</div>`; }
  else if (u && u.kind === 'F' && j.status === 'TERBUKA') act = applyForm(j, u);
  else if (!u) act = `<div class="note">Ingin melamar? <a href="#masuk">Masuk</a> atau <a href="#daftar">daftar gratis</a>. Akun baru mendapat ${NK.pol().freeCreditsPublic} kredit gratis tiap bulan.</div>`;
  else act = '';
  const range = u && NK.plusActive(u) && props.length ? `<div class="card small"><strong>Kisaran harga proposal lain</strong> <span class="pill gold">Plus</span><div class="num" style="margin-top:4px">${rp(Math.min(...props.map((p) => p.price)))} sampai ${rp(Math.max(...props.map((p) => p.price)))} dari ${props.length} proposal</div></div>` : '';
  return `<div class="wrap page split"><div class="stack"><div><div class="crumb"><a href="#lowongan">Cari kerja</a> / ${esc(j.cat)}</div><h1 class="title">${esc(j.title)}</h1><div class="row small muted" style="margin-top:6px">${pill(j.status)}<span>Dipasang ${ago(j.at)}</span></div></div>
    <div class="card stack-s"><p style="white-space:pre-line">${esc(j.desc)}</p>${j.skills.length ? `<div class="tags">${j.skills.map((s) => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : ''}</div>${range}${act}</div>
  <aside class="stack"><div class="card"><div class="lines"><div><span>Anggaran</span><span class="price">${rp(j.budget)}</span></div><div><span>Jenis harga</span><span>Tetap per termin</span></div><div><span>Perkiraan lama</span><span>${j.days} hari</span></div><div><span>Tingkat</span><span>${esc(j.level)}</span></div><div><span>Kredit untuk melamar</span><span>${NK.creditCost(j.budget)}</span></div></div></div>
    <div class="card stack-s"><div class="row" style="flex-wrap:nowrap">${av(c)}<div class="grow"><strong>${esc(c.name)}</strong><div class="muted xs">${esc(c.city)}</div></div></div><div class="row small">${tierPill(c.id)}${mBadge(c)}</div><div class="small">${stars(c.id)}</div>
    <div class="stack-s xs">${vBadges(c)}</div>${NK.payBasis(c) ? `<span class="xs muted">Dasar verifikasi pembayaran: ${esc(NK.payBasis(c))}</span>` : ''}<div class="lines small"><div><span>Tingkat rekrut</span><span>${Math.round(cr.hireRate * 100)}%</span></div><div><span>Total dibayar</span><span>${rp(cr.spent)}</span></div></div>
    ${mine && j.status === 'TERBUKA' ? `<button class="btn s danger" data-a="closeJob" data-id="${j.id}">Tutup lowongan tanpa merekrut</button><p class="xs muted">Kredit para pelamar akan dikembalikan.</p>` : ''}</div></aside></div>`;
}
function proposalRow(p, j) {
  const f = NK.user(p.freelancerId), t = NK.S.threads.find((x) => x.proposalId === p.id);
  return `<div class="card stack-s"><div class="row between"><a class="row" href="#talenta-${f.id}" style="text-decoration:none;color:inherit;flex-wrap:nowrap">${av(f)}<span><strong>${esc(f.name)}</strong><br><span class="small">${stars(f.id)}</span></span></a><div style="text-align:right"><span class="price">${rp(p.price)}</span><div class="muted xs">${p.days} hari</div></div></div><div class="row small">${tierPill(f.id)}${mBadge(f)}${plusBadge(f)}</div><p class="small">${esc(p.cover)}</p>
  ${p.status === 'TERKIRIM' && j.status === 'TERBUKA' ? `<div class="row">${t ? `<a class="btn s" href="#pesan-${t.id}">${ic('chat')} Ruang interview${t.status !== 'TERBUKA' ? ' (ditutup)' : ''}</a>` : `<button class="btn s" data-a="interview" data-id="${p.id}">${ic('chat')} Ajak interview</button>`}<button class="btn pri s" data-a="accept" data-id="${p.id}">Rekrut dan buat kontrak</button><button class="btn s" data-a="rejectP" data-id="${p.id}">Tolak</button></div>` : pill(p.status)}</div>`;
}
function applyForm(j, u) {
  const cr = NK.credits(u.id), cost = NK.creditCost(j.budget), q = qFor(j.budget, j.cat, u, NK.user(j.clientId));
  return `<form class="card stack" data-f="apply" data-id="${j.id}"><h2 class="h2s">Kirim proposal</h2>
  <label class="f">Surat lamaran<small>Tulis apa yang akan Anda kerjakan dan pengalaman yang relevan.</small><textarea class="in" id="ap-cover" name="cover" required></textarea></label>
  <div class="fgrid"><label class="f">Harga Anda<input class="in num" id="ap-price" name="price" inputmode="numeric" value="${j.budget}" data-net="ap-net" data-cat="${esc(j.cat)}" data-cl="${j.clientId}"></label><label class="f">Lama pengerjaan (hari)<input class="in num" id="ap-days" name="days" inputmode="numeric" value="${j.days}"></label></div>
  <div class="lines" id="ap-net">${fLines(q)}</div>
  <div class="row between"><span class="muted small">Melamar memakai <strong>${cost} kredit</strong>. Sisa kredit Anda ${cr.total} (${cr.freeLeft} gratis bulan ini + ${cr.paid} dibeli). ${cr.total < cost ? '<a href="#kredit">Beli kredit</a>' : ''}</span><button class="btn pri" ${cr.total < cost ? 'disabled' : ''}>Kirim proposal (${cost} kredit)</button></div></form>`;
}

function vTalent(id) {
  const f = NK.user(id); if (!f || f.kind !== 'F') return `<div class="wrap page">${empty('Talenta tidak ditemukan')}</div>`;
  const u = NK.me(), r = NK.rankOf(id);

const A = {

const Fm = {
  noop() {},
  hsearch(v) { filt = { ...filt, q: v.q || '', cat: '', member: false, budget: 0 }; go(v.t); },
  filter(v) { filt = { ...filt, q: v.q || '', cat: v.cat || '', member: !!v.member, budget: Number(v.budget) || 0, pay: !!v.pay }; render(); },
  register(v) { done(NK.register(v), 'Akun dibuat.', 'ruang'); },
  apply(v, el) { const u = need('F'); if (u) done(NK.propose(u.id, el.dataset.id, v), 'Proposal terkirim.'); },
  accept(v, el) { const r = NK.acceptProposal(NK.me().id, el.dataset.id, [1, 2, 3].map((i) => ({ title: v['t' + i], amount: v['a' + i] }))); done(r, 'Kontrak dibuat. Danai termin pertama.', r.ok ? 'kontrak-' + r.value.id : null); },
  fund(v, el) { done(NK.fund(NK.me().id, el.dataset.c, el.dataset.m, v.method), 'Dana ditahan aman sampai hasil disetujui.'); },
  progress(v, el) { done(NK.postProgress(NK.me().id, el.dataset.c, el.dataset.m, v.pct, v.note), 'Progres dilaporkan.'); },
  submit(v, el) { done(NK.submitWork(NK.me().id, el.dataset.c, el.dataset.m, v.note), 'Hasil dikirim ke pemberi kerja.'); },
  revise(v, el) { done(NK.askRevision(NK.me().id, el.dataset.c, el.dataset.m, v.note), 'Permintaan revisi terkirim.'); },
  dispute(v, el) { done(NK.openDispute(NK.me().id, el.dataset.c, el.dataset.m, v.reason), 'Sengketa dibuka. Pengelola akan meninjau.'); },
  msg(v, el) {
    const r = NK.send(NK.me().id, el.dataset.id, v.text); if (!r.ok) { toast(r.error, true); return; }
    if (r.value.flags.includes('KASAR')) toast('Pesan terkirim dengan kata kasar disensor (ARIBA-NK-007). Pelanggaran menurunkan peringkat.', true);
    else if (r.value.flags.includes('KONTAK_LUAR')) toast('Pesan ditandai: jaga transaksi tetap di Narakarya (ARIBA-NK-006).');
    render(); const th = $('#thread'); if (th) th.scrollTop = th.scrollHeight; const i = $('#msg-t'); if (i) i.focus();
  },

  closeT(v, el) { done(NK.closeThread(NK.me().id, el.dataset.id, v.reason), 'Ruang interview ditutup.'); },
  reportT(v, el) { done(NK.report(NK.me().id, el.dataset.id, v.reason, !!v.close), 'Laporan terkirim ke Ariba Indonesia.'); },
  buy(v, el) { done(NK.buyCredits(NK.me().id, Number(el.dataset.i), v.method), 'Kredit bertambah.'); },
  plus(v) { done(NK.subscribePlus(NK.me().id, v.method), 'Narakarya Plus aktif.'); },
  review(v, el) { done(NK.review(NK.me().id, el.dataset.id, v.stars, v.text), 'Ulasan terkirim.'); },
  postJob(v) { const r = NK.postJob(NK.me().id, v); done(r, r.ok && r.value.status === 'TERBUKA' ? 'Lowongan tayang.' : 'Lowongan dikirim untuk ditinjau.', r.ok ? 'lowongan-saya' : null); },
  postService(v) { const r = NK.postService(NK.me().id, v); done(r, r.ok && r.value.status === 'TAYANG' ? 'Jasa tayang.' : 'Jasa dikirim untuk ditinjau.'); },
  profile(v) { done(NK.saveProfile(NK.me().id, v), 'Profil disimpan.'); },
  kyc(v) { done(NK.requestKyc(NK.me().id, v), 'Dokumen terkirim. Pengelola akan meninjau.'); },
  payv(v) { done(NK.verifyPayment(NK.me().id, v.method), 'Metode pembayaran terverifikasi.'); },
  payout(v) { done(NK.requestPayout(NK.me().id, v), v.method === 'DOMPET' ? 'Dana masuk ke Dompet ARIBA (simulasi).' : 'Pengajuan pencairan terkirim.'); },
  invite(v, el) { done(NK.invite(NK.me().id, v.job, el.dataset.id), 'Undangan terkirim.'); },
};

function render() {
  const raw = (location.hash || '#beranda').slice(1) || 'beranda';
  const [r, ...rest] = raw.split('-'); const arg = rest.join('-');
  const u = NK.me();
  const authed = (fn, kind) => { if (!u) return vLogin(); if (kind && u.kind !== kind) return `<div class="wrap page">${empty('Halaman ini untuk jenis akun lain', '<a href="#ruang">Kembali ke ruang kerja</a>')}</div>`; return fn(); };
  let html;
  if (r === 'admin') html = vAdmin(arg);
  else if (r === 'beranda') html = vHome();
  else if (r === 'lowongan') html = arg === 'saya' ? authed(vMyJobs, 'K') : (arg ? vJob(arg) : vJobs());
  else if (r === 'talenta') html = arg ? vTalent(arg) : vTalents();
  else if (r === 'jasa') html = arg === 'saya' ? authed(vMyServices, 'F') : (arg ? vService(arg) : vServices());
  else if (r === 'harga' || r === 'biaya') html = vPricing();
  else if (r === 'peringkat') html = vRank();
  else if (r === 'aturan') html = vRules();
  else if (r === 'masuk') html = vLogin();
  else if (r === 'daftar') html = vRegister();
  else if (r === 'ruang') html = authed(vDash);
  else if (r === 'kontrak') html = authed(() => (arg ? vContract(arg) : vContracts()));
  else if (r === 'proposal') html = authed(vProposals, 'F');
  else if (r === 'pasang') html = authed(vPost, 'K');
  else if (r === 'pesan') html = authed(() => (arg ? (u && u.role === 'ADMIN' ? vAdmin('percakapan', arg) : vThread(arg)) : vInbox()));
  else if (r === 'kredit') html = authed(vCredits, 'F');
  else if (r === 'penghasilan') html = authed(vEarn, 'F');
  else if (r === 'pembayaran') html = authed(vPaid, 'K');
  else if (r === 'profil') html = authed(vProfile, 'F');
  else if (r === 'verifikasi') html = authed(vVerify);
  else html = `<div class="wrap page">${empty('Halaman tidak ditemukan', '<a href="#beranda">Kembali ke beranda</a>')}</div>`;
  $('#app').innerHTML = header(r) + `<main>${html}</main>` + footer();
  calcRender();
  const th = $('#thread'); if (th) th.scrollTop = th.scrollHeight;
  if (raw !== currentRoute) { window.scrollTo(0, 0); currentRoute = raw; }
}

function adminCounts() {

  return {
    moderasi: S.jobs.filter((j) => j.status === 'TINJAUAN').length + S.services.filter((s) => s.status === 'TINJAUAN').length,

const monthKey = (t) => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
const monthName = (k) => new Date(Math.floor(k / 12), k % 12, 1).toLocaleDateString('id-ID', { month: 'short' });
const ADMIN_NAME = 'Pengelola Ariba Indonesia';

function barChart(rows) {
  const W = 620, H = 220, L = 58, B = 26, T = 18;
  const max = Math.max(...rows.map((r) => r.v), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const nice = Math.ceil(max / step) * step;
  const sc = (v) => (H - B - T) * (v / nice);
  const bw = (W - L - 8) / rows.length;
  const short = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : v >= 1e3 ? Math.round(v / 1e3).toLocaleString('id-ID') + ' rb' : '0');
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendapatan per bulan" style="width:100%;height:auto;display:block">
  ${[0, 0.5, 1].map((f) => f * nice).map((t) => `<line x1="${L}" x2="${W}" y1="${H - B - sc(t)}" y2="${H - B - sc(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${H - B - sc(t) + 4}" text-anchor="end">${short(t)}</text>`).join('')}
  ${rows.map((r, i) => { const h = sc(r.v), x = L + i * bw + bw * 0.2, last = i === rows.length - 1; return `<rect x="${x}" y="${H - B - h}" width="${bw * 0.6}" height="${h}" rx="2" fill="${last ? 'var(--merah)' : 'var(--abu)'}"><title>${r.l}: ${rp(r.v)}</title></rect><text x="${x + bw * 0.3}" y="${H - 8}" text-anchor="middle">${r.l}</text>${r.v ? `<text x="${x + bw * 0.3}" y="${H - B - h - 5}" text-anchor="middle">${short(r.v)}</text>` : ''}`; }).join('')}</svg>`;
}

  resolveR(v, el) { done(NK.resolveReport(ADMIN_NAME, el.dataset.id, v.action, v.note), 'Laporan ditindaklanjuti.'); },
  resolve(v, el) { done(NK.resolveDispute(ADMIN_NAME, el.dataset.id, v.amount, v.note), 'Sengketa diputus.'); },
  payNo(v, el) { done(NK.rejectPayout(ADMIN_NAME, el.dataset.id, v.reason), 'Pencairan ditolak.'); },
  policy(v) { done(NK.setPolicy(ADMIN_NAME, v), 'Kebijakan baru tersimpan.'); },
};
NK.load();
render();

</script>
