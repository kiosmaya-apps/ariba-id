<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#182B3A">
<title>Narakarya</title>
<meta name="description" content="Narakarya: tempat kerja lepas oleh Ariba Indonesia. Cari freelancer atau pekerjaan, dana ditahan aman, tanpa bunga dan tanpa denda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<style>/* Tata letak: pasar kerja padat dengan "nota kontrak" sebagai ciri khas.
   Tema Indonesia: merah putih. Satu tema terang, sengaja sama seperti situs induk ariba.id.
   Merah sang saka untuk aksi dan bidang utama, putih kertas sebagai dasar, abu hangat sebagai penyeimbang. */
:root{
  color-scheme:light;
  --merah:#C8102E;--merah-d:#A00D25;--merah-tua:#7A0A1C;--merah-gelap:#3B0610;--merah-soft:#FDECEE;--merah-line:#F3C3CA;
  --putih:#FFFFFF;--kertas:#FBF8F6;--abu:#8C7F7A;--abu-soft:#F3EEEB;
  --emas:#9A6B00;--emas-soft:#FBF1D9;
  --sea:#1F7A5A;--sea-soft:#E7F4EE;--ok:#1F7A4A;--ok-soft:#E6F3EA;--warn:#8F5B00;--warn-soft:#FCF0D8;--bad:#B3261E;--bad-soft:#FBE9E8;
  --line:#E8DFDB;--line2:#F1EBE8;--ink:#231A1A;--ink2:#5A4E4C;--ink3:#857875;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--kertas);color:var(--ink);font:400 15px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--merah)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--merah-gelap);text-wrap:balance;letter-spacing:-.005em}
a{color:var(--merah)}a:hover{color:var(--merah-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--merah);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;font-variant-numeric:tabular-nums}
.code{color:var(--merah)}
.muted{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.nm{color:var(--merah-gelap)}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}.stack-s{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}.between{justify-content:space-between}
.grow{flex:1 1 0;min-width:0}
.h2s{font-size:22px}.h2m{font-size:24px;margin-top:12px}

/* bendera & header */
.flag{height:6px;background:linear-gradient(var(--merah) 50%,var(--putih) 50%);border-bottom:1px solid var(--line)}
.strip{background:var(--warn-soft);color:#5f3f0b;font-size:12.5px;border-bottom:1px solid #EFDFC0}
.strip .wrap{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding-block:6px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--putih);color:var(--ink);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 22px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--merah-gelap);text-decoration:none}
.brand:hover{color:var(--merah)}
.brand b{font:600 20px/1 var(--serif);letter-spacing:.02em;display:block;color:var(--merah)}
.brand i{font:normal 9.5px/1 var(--sans);letter-spacing:.2em;color:var(--ink3);display:block;margin-top:4px}
.nav{display:flex;flex-wrap:wrap;gap:2px 18px;flex:1 1 auto}
.nav a{color:var(--ink2);text-decoration:none;font-size:14px;padding:8px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:var(--merah-gelap)}.nav a.on{border-bottom-color:var(--merah);font-weight:600}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink);width:42px;height:42px;cursor:pointer}
.only-m{display:none}
@media(max-width:900px){.nav{display:none;order:9;flex:1 1 100%;flex-direction:column;padding-bottom:6px}.nav.open{display:flex}.burger{display:inline-grid;place-items:center}.brand{flex:1}}
@media(max-width:480px){.acts .btn.pri{display:none}.only-m{display:block}.brand i{letter-spacing:.14em}}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--putih);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--abu);color:var(--ink)}
.btn.pri{background:var(--merah);border-color:var(--merah);color:#fff;font-weight:600}.btn.pri:hover{background:var(--merah-d);border-color:var(--merah-d);color:#fff}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:600}.btn.sea:hover{background:#17654a;color:#fff}
.btn.danger{color:var(--bad);border-color:#EBC0BD}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.s{min-height:34px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:var(--merah);color:#fff;border-bottom:8px solid var(--putih);box-shadow:0 1px 0 var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:48px;align-items:center;padding-block:44px 60px}
.hero h1{color:#fff;font-size:clamp(34px,4.6vw,54px);line-height:1.08}
.hero p.lead{color:#FDE4E7;font-size:17px;max-width:56ch;margin-top:14px}
@media(max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:28px 40px}}
.searchbox{display:flex;flex-wrap:wrap;gap:0;background:#fff;border-radius:8px;margin-top:22px;padding:5px}
.searchbox select{border:0;background:var(--merah-soft);border-radius:5px;padding:0 10px;min-height:44px;color:var(--merah-gelap);font-size:14px;font-weight:500}
.searchbox input{flex:1 1 180px;min-width:0;border:0;padding:0 12px;min-height:44px;background:transparent;color:var(--ink);outline-offset:-2px}
@media(max-width:480px){.searchbox button{flex:1 1 100%;margin-top:5px}.searchbox input{flex:1 1 150px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:13px;color:#FBD3D9}
.chips a{color:#fff;text-decoration:underline;text-underline-offset:3px}

/* nota */
.nota{background:var(--putih);color:var(--ink);border-radius:4px;padding:20px 20px 16px;box-shadow:0 14px 34px rgba(59,6,16,.32);font-size:14px;border-top:5px solid var(--merah-gelap)}
.nota.flat{box-shadow:none;border:1px solid var(--line);border-top:5px solid var(--merah)}
.nota h3{font-size:16px;font-family:var(--sans);font-weight:600;color:var(--merah-gelap)}
.nota .no{font:500 11px var(--mono);color:var(--ink3);letter-spacing:.04em}
.lines{display:flex;flex-direction:column;margin-top:10px}
.lines>div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px dashed var(--line)}
.lines>div:first-child{border-top:0}
.lines .t{border-top:1px solid var(--merah-gelap);font-weight:600;color:var(--merah-gelap)}
.lines span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

/* bagian */
section.band{padding-block:44px}
.band.alt{background:var(--putih);border-block:1px solid var(--line)}
.band.dark{background:var(--merah-tua);color:#fff}.band.dark h2{color:#fff}
.sect-h{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:baseline;margin-bottom:20px}
h2{font-size:clamp(25px,3vw,32px);line-height:1.15}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.span2{grid-column:1/-1}
@media(max-width:980px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
.catlist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 22px}
@media(max-width:980px){.catlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.catlist a{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--merah-gelap);text-decoration:none;font-weight:500;font-size:14px}
.catlist a:hover{color:var(--merah)}.catlist span{color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:400}

.card{background:var(--putih);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
a.card{display:block;text-decoration:none;color:inherit}a.card:hover{border-color:var(--merah-line);color:inherit}
.card h3{font-size:17px;line-height:1.3}
.card.plus{border-color:#EBD7A6;background:linear-gradient(var(--putih),var(--putih)) padding-box}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.price{font-weight:600;color:var(--merah-gelap);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--abu-soft);color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--abu-soft);color:var(--ink2);white-space:nowrap}
.pill svg.i{width:12px;height:12px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.red{background:var(--merah-soft);color:var(--merah-d)}.pill.sea{background:var(--sea-soft);color:var(--sea)}.pill.gold{background:var(--emas-soft);color:var(--emas)}
.badge-m{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--sea);white-space:nowrap}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff}
.av.lg{width:72px;height:72px;font-size:24px}.av.sm{width:30px;height:30px;font-size:11.5px}
.star{color:var(--emas);font-weight:600;white-space:nowrap}
.bar,.track{flex:1 1 80px;height:8px;background:var(--abu-soft);border-radius:4px;overflow:hidden;min-width:60px}
.track{height:6px;margin-top:3px}
.bar i,.track i{display:block;height:100%;background:var(--merah);border-radius:4px}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;counter-reset:s}
@media(max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps>div{counter-increment:s;border-top:3px solid var(--merah);padding-top:10px}
.steps>div::before{content:"Langkah " counter(s);font:500 11.5px var(--mono);color:var(--merah)}
.steps h3{font-size:18px;margin:4px 0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--ink2);cursor:pointer}
.tabs button.on{color:var(--merah-gelap);border-bottom-color:var(--merah);font-weight:600}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--putih)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:left;background:#FCF9F7;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tmin{min-width:720px}

/* tata letak halaman */
.page{padding-block:24px 56px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:920px){.split{grid-template-columns:minmax(0,1fr)}}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:6px}.crumb a{color:var(--ink2)}
.title{font-size:clamp(25px,3.2vw,32px);line-height:1.15}

/* formulir */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink);min-width:0}
label.f small{font-weight:400;color:var(--ink2)}
input.in,select.in,textarea.in{width:100%;min-height:42px;border:1px solid #D9CEC9;border-radius:6px;background:#fff;padding:8px 11px;font-size:15px;font-weight:400}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.x3{grid-template-columns:repeat(3,minmax(0,1fr))}.fgrid.x4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:620px){.fgrid,.fgrid.x3,.fgrid.x4{grid-template-columns:minmax(0,1fr)}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#fff}
.choice:has(input:checked){border-color:var(--merah);background:var(--merah-soft)}
.choice input{accent-color:var(--merah)}
.note{border-radius:6px;padding:10px 12px;font-size:13.5px;background:var(--abu-soft);color:var(--ink)}
.note svg.i{vertical-align:-3px}
.note.warn{background:var(--warn-soft);color:#5f3f0b}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.sea{background:var(--sea-soft);color:#135a41}.note.ok{background:var(--ok-soft);color:#165a35}

/* sub menu */
.sub{background:var(--putih);border-bottom:1px solid var(--line)}
.sub .wrap{display:flex;gap:4px 20px;overflow-x:auto;scrollbar-width:none}
.sub a{padding:12px 0;font-size:14px;color:var(--ink2);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.sub a.on{color:var(--merah-gelap);font-weight:600;border-bottom-color:var(--merah)}

/* termin & percakapan */
.ms{border:1px solid var(--line);border-radius:6px;background:var(--putih);padding:14px}
.ms+.ms{margin-top:10px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow-y:auto;padding:2px}
.bub{max-width:86%;padding:8px 11px;border-radius:8px;background:var(--abu-soft);font-size:14px;overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;background:var(--merah-soft)}
.bub.sys{align-self:center;max-width:94%;background:transparent;border:1px dashed var(--line);color:var(--ink2);font-size:12.5px;text-align:center}
.bub small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}
.flagtxt{color:var(--bad);font-weight:600}

/* admin */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:70vh}
.adm-side{background:var(--merah-gelap);color:#F6D9DD;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.adm-side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#F6D9DD;text-decoration:none;font-size:14px}
.adm-side a:hover{background:var(--merah-tua);color:#fff}.adm-side a.on{background:var(--merah);color:#fff;font-weight:600}
.adm-side em{margin-left:auto;font-style:normal;font:500 11.5px var(--mono);background:#fff;color:var(--merah-d);border-radius:999px;padding:1px 7px}
.adm-main{padding:22px clamp(16px,3vw,32px) 56px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media(max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}.adm-side{flex-direction:row;overflow-x:auto;padding:8px}.adm-side a{white-space:nowrap}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--putih);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--ink2);display:block}
.kpi b{display:block;font:600 clamp(19px,2.3vw,24px)/1.25 var(--sans);color:var(--merah-gelap);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--ink3);font-size:12px}
.bars text{font:11px var(--sans);fill:var(--ink2)}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(59,6,16,.5);z-index:40;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--putih);border-radius:8px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 32px);overflow-y:auto;border-top:5px solid var(--merah)}
.modal h3{font-size:20px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--merah-gelap);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}

.persona{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--putih);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.persona:hover{border-color:var(--merah-line)}
.foot{background:var(--merah-gelap);color:#E8C4CA;font-size:13.5px;border-top:6px solid var(--merah)}
.foot .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:space-between}
.foot a{color:#fff}
details.q{border-bottom:1px solid var(--line);padding:12px 0}
details.q summary{cursor:pointer;font-weight:600;color:var(--merah-gelap)}
details.q p{margin-top:6px;color:var(--ink2);max-width:72ch}
@media(prefers-reduced-motion:no-preference){a.card,.btn{transition:border-color .12s,background .12s}}
.vchk{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink3);white-space:nowrap}
.vchk.ok{color:var(--ok);font-weight:600}
.stack>.bar,.stack-s>.bar{flex:0 0 auto}
</style>

<script>
/* ==========================================================================
   Narakarya: mesin data prototipe (berjalan di peramban, tanpa server).
   Nominal selalu Rupiah bulat. Setiap gerakan uang dicatat berpasangan.
   Skema biaya mengikuti Upwork: biaya layanan freelancer 0-15% per kategori,
   biaya layanan klien, kredit untuk melamar, dan langganan Plus. PPN 11%.
   ========================================================================== */
const NK = (() => {
  const KEY = 'narakarya.demo.v2';
  const DAY = 864e5;
  let clock = null;
  const now = () => clock ?? Date.now();

  const CATS = ['Desain & Kreatif', 'Web & Aplikasi', 'Penulisan & Terjemahan', 'Pemasaran Digital', 'Video & Animasi', 'Akuntansi & Pajak', 'Administrasi & Data', 'Hukum & Perizinan', 'Konsultasi Usaha', 'Pelatihan & Mengajar'];

  const POLICY0 = {
    version: 1,
    /* biaya layanan freelancer: per kategori, 0-15% seperti Upwork */
    catFee: { 'Desain & Kreatif': 10, 'Web & Aplikasi': 12, 'Penulisan & Terjemahan': 8, 'Pemasaran Digital': 10, 'Video & Animasi': 10, 'Akuntansi & Pajak': 10, 'Administrasi & Data': 8, 'Hukum & Perizinan': 10, 'Konsultasi Usaha': 12, 'Pelatihan & Mengajar': 8 },
    memberFeeDiscount: 3,
    cFeePublic: 5, cFeeMember: 3,
    ppnPct: 11,
    pph22Active: false, pph22Pct: 0.5,
    /* kredit */
    creditPrice: 1000,
    packs: [{ n: 10, p: 10000 }, { n: 40, p: 36000 }, { n: 80, p: 68000 }, { n: 150, p: 120000 }],
    memberPackBonusPct: 25,
    freeCreditsPublic: 10, freeCreditsMember: 30,
    plusPricePublic: 59000, plusPriceMember: 39000, plusCredits: 100,
    /* lain-lain */
    holdDaysPublic: 3, holdDaysMember: 0,
    payoutFeePublic: 2500, payoutFeeMember: 0,
    autoReleaseDays: 7,
    minMilestone: 50000, minPayout: 50000,
    blocked: ['judi', 'slot gacor', 'togel', 'pinjol', 'pinjaman online', 'bunga harian', 'pornografi', 'phishing', 'penipuan'],
    review: ['joki', 'followers palsu', 'ulasan palsu', 'skripsi', 'retas', 'kripto'],
    profanity: ['anjing', 'anjir', 'bangsat', 'bajingan', 'keparat', 'brengsek', 'goblok', 'goblog', 'tolol', 'bego', 'idiot', 'kampret', 'jancok', 'jancuk', 'cok', 'asu', 'tai', 'taik', 'sialan', 'kontol', 'memek', 'ngentot', 'entot', 'pepek', 'pelacur', 'lonte', 'perek', 'bencong', 'fuck', 'shit', 'bitch', 'bastard', 'asshole'],
  };
  const TIERS = [[1000000, 2], [5000000, 4], [20000000, 6], [Infinity, 8]];

  const ACC = {
    KAS: '1-1000 Rekening penampung mitra pembayaran',
    HELD: '2-1000 Dana klien ditahan',
    SALDO: '2-2000 Saldo freelancer',
    PAYOUT: '2-3000 Pencairan diproses',
    PPN: '2-4000 PPN keluaran',
    PPH: '2-4100 Utang PPh 22 dipungut',
    KOMISI: '4-1000 Biaya layanan freelancer',
    KLIEN: '4-1100 Biaya layanan klien',
    KREDIT: '4-2000 Penjualan kredit',
    PLUS: '4-2100 Langganan Narakarya Plus',
    FEE: '4-3000 Biaya transfer',
  };
  const REV = ['KOMISI', 'KLIEN', 'KREDIT', 'PLUS', 'FEE'];

  const clonePolicy = () => JSON.parse(JSON.stringify(POLICY0));
  const blank = () => ({
    seq: 100, session: null, policy: clonePolicy(),
    users: [], jobs: [], proposals: [], services: [], contracts: [], msgs: [], reviews: [],
    earnings: [], payouts: [], disputes: [], ledger: [], audit: [], invites: [], sales: [], threads: [], reports: [], progress: [],
  });
  let S = blank();

  /* ---------- penyimpanan ---------- */
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* mode privat: tetap jalan di memori */ } };
  const load = () => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) { try { S = JSON.parse(raw); sweep(); return; } catch (e) { /* data rusak: mulai ulang */ } }
    reset();
  };
  const reset = () => { S = blank(); seed(); clock = null; sweep(); save(); };

  /* ---------- utilitas ---------- */
  const ok = (value) => ({ ok: true, value });
  const err = (error, code) => ({ ok: false, error, code });
  const id = (p) => p + (++S.seq);
  const user = (u) => S.users.find((x) => x.id === u);
  const isMember = (u) => !!(u && u.member && u.member.status === 'AKTIF');
  const clean = (t) => String(t ?? '').trim();
  const num = (v) => Math.round(Number(String(v ?? '').replace(/[^\d]/g, '')) || 0);
  const pol = () => S.policy;
  const rpTxt = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const bpsOf = (x, bps) => Math.floor(x * bps / 10000);
  const ppnOf = (x) => Math.floor(x * pol().ppnPct / 100);
  const monthStart = () => { const d = new Date(now()); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };

  const audit = (actor, action, detail) => { S.audit.unshift({ id: id('a'), at: now(), actor, action, detail }); };
  const post = (memo, lines, ref) => {
    const L = lines.filter((l) => (l.dr || l.cr));
    const dr = L.reduce((a, l) => a + (l.dr || 0), 0), cr = L.reduce((a, l) => a + (l.cr || 0), 0);
    if (dr !== cr) throw new Error('Jurnal tidak seimbang: ' + memo);
    S.ledger.unshift({ id: id('j'), at: now(), memo, ref, lines: L });
  };

  const screen = (text) => {
    const t = ' ' + clean(text).toLowerCase() + ' ';
    const hit = (w) => t.includes(w.toLowerCase());
    const b = pol().blocked.find(hit); if (b) return { verdict: 'BLOCK', word: b };
    const r = pol().review.find(hit); if (r) return { verdict: 'REVIEW', word: r };
    return { verdict: 'ALLOW' };
  };

  /* ---------- penyaring kata kasar (ARIBA-NK-007) ---------- */
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's' };
  const profane = (text) => {
    const words = pol().profanity || [];
    const out = []; let masked = String(text ?? '');
    const norm = masked.toLowerCase().replace(/[013457@$]/g, (c) => LEET[c]);
    words.forEach((w) => {
      const re = new RegExp('(^|[^a-z])(' + w.split('').map((ch) => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '+').join('[\\W_]*') + ')(?=$|[^a-z])', 'gi');
      let m; while ((m = re.exec(norm))) { const st = m.index + m[1].length, len = m[2].length; out.push(w); masked = masked.slice(0, st) + '*'.repeat(len) + masked.slice(st + len); }
    });
    return { hit: out.length ? out[0] : null, count: out.length, masked };
  };
  const rude = (...texts) => { for (const t of texts) { const r = profane(t); if (r.hit) return err('Teks memuat kata kasar atau tidak pantas. Mohon gunakan bahasa yang sopan (ARIBA-NK-007).', 'ARIBA-NK-007'); } return null; };

  /* ---------- biaya ---------- */
  const freelancerPct = (cat, member) => {
    const P = pol(); const base = P.catFee[cat] ?? 10;
    return Math.max(0, Math.min(15, base) - (member ? P.memberFeeDiscount : 0));
  };
  const feesFor = (cat, fMember, cMember) => ({
    ffBps: Math.round(freelancerPct(cat, fMember) * 100),
    cfBps: Math.round((cMember ? pol().cFeeMember : pol().cFeePublic) * 100),
    ppnPct: pol().ppnPct,
  });
  /* rincian satu nominal dengan biaya tertentu */
  const quote = (amount, f) => {
    const ff = bpsOf(amount, f.ffBps), ffPpn = Math.floor(ff * f.ppnPct / 100);
    const cf = bpsOf(amount, f.cfBps), cfPpn = Math.floor(cf * f.ppnPct / 100);
    return { amount, ff, ffPpn, net: amount - ff - ffPpn, cf, cfPpn, clientTotal: amount + cf + cfPpn, ffPct: f.ffBps / 100, cfPct: f.cfBps / 100, ppnPct: f.ppnPct };
  };

  /* ---------- kredit & Plus ---------- */
  const creditCost = (budget) => TIERS.find(([lim]) => budget <= lim)[1];
  const plusActive = (u) => !!(u && u.plusUntil && u.plusUntil > now());
  const allowance = (u) => (plusActive(u) ? pol().plusCredits : (isMember(u) ? pol().freeCreditsMember : pol().freeCreditsPublic));
  const freeUsed = (uid) => S.proposals.filter((p) => p.freelancerId === uid && p.at >= monthStart() && !p.refunded).reduce((a, p) => a + (p.credits ? p.credits.free : 0), 0);
  const credits = (uid) => { const u = user(uid); const al = allowance(u); const left = Math.max(0, al - freeUsed(uid)); return { allowance: al, freeLeft: left, paid: u.credits || 0, total: left + (u.credits || 0) }; };
  const packFor = (u, i) => { const pk = pol().packs[i]; if (!pk) return null; const bonus = isMember(u) ? Math.floor(pk.n * pol().memberPackBonusPct / 100) : 0; return { n: pk.n, bonus, p: pk.p, ppn: ppnOf(pk.p), total: pk.p + ppnOf(pk.p) }; };
  const buyCredits = (uid, i, method) => {
    const u = user(uid); if (!u || u.kind !== 'F') return err('Kredit hanya untuk akun freelancer.');
    const pk = packFor(u, i); if (!pk) return err('Pilih paket kredit.');
    u.credits = (u.credits || 0) + pk.n + pk.bonus;
    post(`Penjualan ${pk.n + pk.bonus} kredit ${u.name}`, [{ acc: 'KAS', dr: pk.total }, { acc: 'KREDIT', cr: pk.p }, { acc: 'PPN', cr: pk.ppn }], uid);
    S.sales.unshift({ id: id('b'), uid, kind: 'KREDIT', label: `${pk.n} kredit${pk.bonus ? ` + bonus ${pk.bonus}` : ''}`, price: pk.p, ppn: pk.ppn, method: method || 'QRIS', at: now() });
    audit(u.name, 'Membeli kredit', `${pk.n + pk.bonus} kredit, ${rpTxt(pk.total)} termasuk PPN`); save(); return ok(pk);
  };
  const plusPrice = (u) => { const p = isMember(u) ? pol().plusPriceMember : pol().plusPricePublic; return { p, ppn: ppnOf(p), total: p + ppnOf(p) }; };
  const subscribePlus = (uid, method) => {
    const u = user(uid); if (!u || u.kind !== 'F') return err('Narakarya Plus untuk akun freelancer.');
    const x = plusPrice(u);
    u.plusUntil = Math.max(now(), u.plusUntil || 0) + 30 * DAY;
    post(`Langganan Plus ${u.name}`, [{ acc: 'KAS', dr: x.total }, { acc: 'PLUS', cr: x.p }, { acc: 'PPN', cr: x.ppn }], uid);
    S.sales.unshift({ id: id('b'), uid, kind: 'PLUS', label: 'Narakarya Plus 30 hari', price: x.p, ppn: x.ppn, method: method || 'QRIS', at: now() });
    audit(u.name, 'Berlangganan Narakarya Plus', `${rpTxt(x.total)} termasuk PPN, aktif sampai ${new Date(u.plusUntil).toLocaleDateString('id-ID')}`); save(); return ok(x);
  };

  /* ---------- akun ---------- */
  const register = ({ name, kind, city, email }) => {
    name = clean(name);
    const rn = rude(name); if (rn) return rn;
    if (name.length < 3) return err('Isi nama lengkap, minimal 3 huruf.');
    if (!['F', 'K'].includes(kind)) return err('Pilih apakah Anda mencari kerja atau mencari freelancer.');
    if (!/.+@.+\..+/.test(clean(email))) return err('Isi alamat email yang benar.');
    const u = { id: id('u'), name, kind, city: clean(city) || 'Indonesia', email: clean(email), status: 'AKTIF', kyc: 'BELUM', member: null, headline: '', skills: [], rate: 0, bio: '', cat: CATS[0], credits: 0, joinedAt: now() };
    S.users.push(u); S.session = u.id;
    audit(u.name, 'Pendaftaran akun', kind === 'F' ? 'Freelancer umum' : 'Klien umum');
    save(); return ok(u);
  };
  const login = (uid) => { S.session = uid; save(); };
  const logout = () => { S.session = null; save(); };
  const me = () => user(S.session);
  const saveProfile = (uid, p) => {
    const u = user(uid); if (!u) return err('Akun tidak ditemukan.');
    const rf = rude(p.headline, p.bio, p.skills); if (rf) return rf;
    Object.assign(u, { headline: clean(p.headline), bio: clean(p.bio), city: clean(p.city), rate: num(p.rate), cat: p.cat || u.cat, pph22Stmt: !!p.pph22Stmt,
      skills: clean(p.skills).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 10) });
    save(); return ok(u);
  };
  /* ---------- verifikasi identitas & pembayaran ---------- */
  const digits = (v) => String(v ?? '').replace(/\D/g, '');
  const mask = (v) => { const d = digits(v); return d ? '•'.repeat(Math.max(0, d.length - 4)) + d.slice(-4) : ''; };
  const idVerified = (u) => !!u && (isMember(u) || u.kyc === 'TERVERIFIKASI');
  const hasFunded = (uid) => S.contracts.some((c) => c.clientId === uid && c.milestones.some((m) => m.fundedAt));
  const payVerified = (u) => !!u && (isMember(u) || !!u.payVerif || hasFunded(u.id));
  const payBasis = (u) => (isMember(u) ? 'Dompet ARIBA (anggota koperasi)' : u.payVerif ? u.payVerif.label : hasFunded(u.id) ? 'Pernah mendanai termin' : null);
  const requestKyc = (uid, d = {}) => {
    const u = user(uid);
    if (isMember(u)) return err('Anggota koperasi ARIBA sudah terverifikasi otomatis lewat akun Ariba.');
    if (u.kyc === 'TERVERIFIKASI') return err('Identitas Anda sudah terverifikasi.');
    if (u.kyc === 'MENUNGGU') return err('Verifikasi Anda sedang ditinjau.');
    const type = u.kind === 'F' ? 'INDIVIDU' : (d.type === 'PERUSAHAAN' ? 'PERUSAHAAN' : 'INDIVIDU');
    let data;
    if (type === 'INDIVIDU') {
      if (clean(d.ktpName).length < 3) return err('Isi nama sesuai KTP.');
      if (digits(d.nik).length !== 16) return err('NIK harus 16 digit sesuai KTP.');
      if (!d.selfie) return err('Unggah swafoto sambil memegang KTP.');
      data = { ktpName: clean(d.ktpName), nik: mask(d.nik) };
    } else {
      if (clean(d.entity).length < 3) return err('Isi nama badan usaha sesuai akta.');
      if (!['PT', 'CV', 'Firma', 'Yayasan', 'Koperasi', 'BUMDes', 'Perkumpulan'].includes(d.form)) return err('Pilih bentuk badan usaha.');
      if (digits(d.nib).length !== 13 && d.form !== 'Yayasan' && d.form !== 'Perkumpulan') return err('NIB harus 13 digit sesuai OSS.');
      const np = digits(d.npwp).length; if (np !== 15 && np !== 16) return err('NPWP badan harus 15 atau 16 digit.');
      if (clean(d.deed).length < 3) return err('Isi nomor akta pendirian atau SK pengesahan Kemenkumham.');
      if (clean(d.pic).length < 3 || clean(d.picRole).length < 2) return err('Isi nama dan jabatan penanggung jawab akun.');
      if (digits(d.picNik).length !== 16) return err('NIK penanggung jawab harus 16 digit.');
      if (!d.docs) return err('Unggah akta/SK, NIB, NPWP badan, KTP penanggung jawab, dan surat kuasa bila bukan pengurus.');
      data = { entity: clean(d.entity), form: d.form, nib: mask(d.nib), npwp: mask(d.npwp), deed: clean(d.deed), pic: clean(d.pic), picRole: clean(d.picRole), picNik: mask(d.picNik) };
    }
    u.kyc = 'MENUNGGU'; u.kycAt = now(); u.kycType = type; u.kycData = data;
    audit(u.name, type === 'PERUSAHAAN' ? 'Mengirim verifikasi perusahaan' : 'Mengirim verifikasi identitas', 'Menunggu tinjauan pengelola'); save(); return ok(u);
  };
  const verifyPayment = (uid, method) => {
    const u = user(uid); if (!u || u.kind !== 'K') return err('Verifikasi pembayaran untuk pemberi kerja.');
    if (payVerified(u) && u.payVerif) return err('Metode pembayaran Anda sudah terverifikasi.');
    const L = { KARTU: 'Kartu debit/kredit (otorisasi Rp 10.000 dibatalkan)', GOPAY: 'GoPay tertaut', SHOPEEPAY: 'ShopeePay tertaut', DANA: 'DANA tertaut', DEBIT: 'Debit langsung rekening bank' };
    if (!L[method]) return err('Pilih metode pembayaran.');
    u.payVerif = { method, label: L[method], at: now() };
    audit(u.name, 'Memverifikasi metode pembayaran', L[method]); save(); return ok(u);
  };

  /* ---------- lowongan ---------- */
  const postJob = (cid, j) => {
    const u = user(cid);
    if (!u || u.status !== 'AKTIF') return err('Akun Anda sedang ditangguhkan.');
    const title = clean(j.title), desc = clean(j.desc), budget = num(j.budget);
    if (title.length < 10) return err('Judul minimal 10 huruf agar mudah dipahami.');
    if (desc.length < 30) return err('Jelaskan pekerjaannya minimal 30 huruf. Lingkup yang jelas mencegah sengketa.');
    if (budget < pol().minMilestone) return err('Anggaran minimal ' + rpTxt(pol().minMilestone) + '.');
    const rj = rude(title, desc, j.skills); if (rj) return rj;
    const sc = screen(title + ' ' + desc);
    if (sc.verdict === 'BLOCK') {
      audit(u.name, 'Lowongan diblokir ARIBA-NK-003', `Kata "${sc.word}" pada "${title}"`); save();
      return err(`Lowongan tidak dapat ditayangkan karena memuat "${sc.word}". Narakarya menolak pekerjaan yang terkait riba, judi, penipuan, dan konten terlarang (ARIBA-NK-003).`, 'ARIBA-NK-003');
    }
    const job = { id: id('j'), clientId: cid, title, desc, budget, cat: j.cat || CATS[0], level: j.level || 'Menengah', days: num(j.days) || 14,
      skills: clean(j.skills).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 8), at: now(), flag: sc.verdict === 'REVIEW' ? sc.word : null,
      status: (isMember(u) && sc.verdict === 'ALLOW') ? 'TERBUKA' : 'TINJAUAN' };
    S.jobs.unshift(job);
    audit(u.name, 'Memasang lowongan', `${title} (${job.status})`); save();
    return ok(job);
  };
  const moderateJob = (admin, jid, approve, reason) => {
    const j = S.jobs.find((x) => x.id === jid); if (!j) return err('Lowongan tidak ditemukan.');
    if (!approve && clean(reason).length < 10) return err('Tulis alasan penolakan, minimal 10 huruf.');
    j.status = approve ? 'TERBUKA' : 'DITOLAK'; j.reason = clean(reason); j.flag = approve ? null : j.flag;
    audit(admin, approve ? 'Menyetujui lowongan' : 'Menolak lowongan', j.title + (reason ? ': ' + reason : '')); save(); return ok(j);
  };
  const refundCredits = (p) => {
    if (p.refunded || !p.credits) return;
    p.refunded = true; const f = user(p.freelancerId); f.credits = (f.credits || 0) + p.credits.paid;
  };
  const closeJob = (cid, jid) => {
    const j = S.jobs.find((x) => x.id === jid && x.clientId === cid); if (!j) return err('Lowongan tidak ditemukan.');
    j.status = 'DITUTUP';
    const P = S.proposals.filter((p) => p.jobId === jid && p.status === 'TERKIRIM');
    P.forEach((p) => { p.status = 'DITOLAK'; refundCredits(p); });
    audit(user(cid).name, 'Menutup lowongan tanpa merekrut', `${j.title}; kredit ${P.length} pelamar dikembalikan`); save(); return ok(j);
  };

  /* ---------- proposal ---------- */
  const propose = (fid, jid, p) => {
    const u = user(fid), j = S.jobs.find((x) => x.id === jid);
    if (!u || u.status !== 'AKTIF') return err('Akun Anda sedang ditangguhkan.');
    if (!j || j.status !== 'TERBUKA') return err('Lowongan ini sudah tidak menerima lamaran.');
    if (j.clientId === fid) return err('Anda tidak dapat melamar lowongan sendiri.');
    if (S.proposals.some((x) => x.jobId === jid && x.freelancerId === fid && x.status !== 'DITARIK')) return err('Anda sudah melamar lowongan ini.');
    const cover = clean(p.cover), price = num(p.price), days = num(p.days);
    if (cover.length < 30) return err('Tulis surat lamaran minimal 30 huruf: apa yang akan Anda kerjakan dan pengalaman yang relevan.');
    if (price < pol().minMilestone) return err('Harga yang diajukan terlalu kecil.');
    if (days < 1) return err('Isi perkiraan lama pengerjaan dalam hari.');
    const rp_ = rude(cover); if (rp_) return rp_;
    const cost = creditCost(j.budget), c = credits(fid);
    if (c.total < cost) return err(`Lowongan ini perlu ${cost} kredit, sisa kredit Anda ${c.total}. Beli kredit mulai 10 kredit atau berlangganan Plus.`, 'KREDIT');
    const free = Math.min(c.freeLeft, cost), paid = cost - free;
    u.credits = (u.credits || 0) - paid;
    const x = { id: id('p'), jobId: jid, freelancerId: fid, cover, price, days, status: 'TERKIRIM', at: now(), credits: { free, paid } };
    S.proposals.unshift(x);
    audit(u.name, 'Mengirim proposal', `${j.title} (${cost} kredit)`); save(); return ok(x);
  };
  const withdrawProposal = (fid, pid) => {
    const p = S.proposals.find((x) => x.id === pid && x.freelancerId === fid);
    if (!p || p.status !== 'TERKIRIM') return err('Proposal ini tidak dapat ditarik.');
    p.status = 'DITARIK'; save(); return ok(p);
  };
  const rejectProposal = (cid, pid) => {
    const p = S.proposals.find((x) => x.id === pid); if (!p) return err('Proposal tidak ditemukan.');
    const j = S.jobs.find((x) => x.id === p.jobId);
    if (!j || j.clientId !== cid || p.status !== 'TERKIRIM') return err('Proposal ini tidak dapat ditolak.');
    p.status = 'DITOLAK'; save(); return ok(p);
  };

  /* ---------- kontrak ---------- */
  const newContract = ({ clientId, freelancerId, title, cat, jobId, serviceId, milestones }) => {
    const year = new Date(now()).getFullYear();
    const f = feesFor(cat, isMember(user(freelancerId)), isMember(user(clientId)));
    const c = { id: id('k'), no: `NK-${year}-${String(S.contracts.length + 1).padStart(4, '0')}`, clientId, freelancerId, title, cat, jobId: jobId || null, serviceId: serviceId || null,
      total: milestones.reduce((a, m) => a + m.amount, 0), ...f, policyVersion: pol().version, status: 'AKTIF', at: now(),
      milestones: milestones.map((m) => ({ id: id('m'), title: m.title, amount: m.amount, days: m.days || null, status: 'BELUM_DANA', revisions: 0 })) };
    S.contracts.unshift(c);
    return c;
  };
  const acceptProposal = (cid, pid, rows) => {
    const p = S.proposals.find((x) => x.id === pid); if (!p || p.status !== 'TERKIRIM') return err('Proposal ini sudah tidak aktif.');
    const j = S.jobs.find((x) => x.id === p.jobId); if (!j || j.clientId !== cid) return err('Hanya pemilik lowongan yang dapat menerima proposal.');
    if (user(p.freelancerId).status !== 'AKTIF') return err('Akun freelancer ini sedang ditangguhkan.');
    if (!idVerified(user(cid))) return err('Verifikasi identitas atau perusahaan Anda dahulu sebelum merekrut. Freelancer perlu tahu siapa pemberi kerjanya.', 'VERIFIKASI');
    const ms = rows.map((r) => ({ title: clean(r.title), amount: num(r.amount) })).filter((r) => r.title || r.amount);
    if (!ms.length) return err('Isi minimal satu termin.');
    if (ms.some((m) => m.title.length < 3)) return err('Setiap termin perlu judul hasil kerja yang jelas (ARIBA-NK-001).', 'ARIBA-NK-001');
    if (ms.some((m) => m.amount < pol().minMilestone)) return err(`Nilai tiap termin minimal ${rpTxt(pol().minMilestone)}.`);
    const sum = ms.reduce((a, m) => a + m.amount, 0);
    if (sum !== p.price) return err(`Total termin harus sama dengan harga proposal (selisih ${rpTxt(Math.abs(sum - p.price))}).`);
    p.status = 'DITERIMA'; j.status = 'TERISI';
    S.proposals.filter((x) => x.jobId === j.id && x.id !== p.id && x.status === 'TERKIRIM').forEach((x) => { x.status = 'DITOLAK'; });
    const c = newContract({ clientId: cid, freelancerId: p.freelancerId, title: j.title, cat: j.cat, jobId: j.id, milestones: ms });
    const t = S.threads.find((x) => x.proposalId === p.id);
    if (t) { Object.assign(t, { kind: 'KONTRAK', contractId: c.id, status: 'TERBUKA' }); sys(t, `Proposal diterima. Kontrak ${c.no} dibuat; percakapan ini tetap terbuka selama kontrak berjalan.`); }
    else newThread({ kind: 'KONTRAK', clientId: cid, freelancerId: p.freelancerId, jobId: j.id, proposalId: p.id, contractId: c.id });
    audit(user(cid).name, 'Menerima proposal', `${c.no} dengan ${user(p.freelancerId).name}`); save(); return ok(c);
  };
  const orderService = (cid, sid, tier) => {
    const s = S.services.find((x) => x.id === sid), u = user(cid);
    if (!s || s.status !== 'TAYANG') return err('Jasa ini tidak tersedia.');
    if (s.freelancerId === cid) return err('Anda tidak dapat memesan jasa sendiri.');
    const t = s.tiers[tier]; if (!t) return err('Pilih paket.');
    if (!idVerified(u)) return err('Verifikasi identitas atau perusahaan Anda dahulu sebelum memesan jasa.', 'VERIFIKASI');
    const c = newContract({ clientId: cid, freelancerId: s.freelancerId, title: `${s.title} (${t.name})`, cat: s.cat, serviceId: sid, milestones: [{ title: t.scope, amount: t.price, days: t.days }] });
    newThread({ kind: 'KONTRAK', clientId: cid, freelancerId: s.freelancerId, contractId: c.id });
    audit(u.name, 'Memesan jasa', c.no + ' ' + s.title); save(); return ok(c);
  };
  const getC = (cid) => S.contracts.find((c) => c.id === cid);
  const getM = (c, mid) => c.milestones.find((m) => m.id === mid);
  const heldOf = (m) => m.amount + (m.cf || 0) + (m.cfPpn || 0);

  const settle = (c) => {
    if (c.milestones.every((m) => ['CAIR', 'DIKEMBALIKAN'].includes(m.status))) {
      c.status = c.milestones.some((m) => m.status === 'CAIR') ? 'SELESAI' : 'DIBATALKAN';
      c.closedAt = now();
    }
  };
  const fund = (uid, cid, mid, method) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien kontrak ini yang dapat mendanai termin.');
    const m = getM(c, mid); if (!m) return err('Termin tidak ditemukan.');
    if (m.status !== 'BELUM_DANA') return ok(m); /* idempoten: notifikasi ganda tidak memposting dua kali */
    const q = quote(m.amount, c);
    m.cf = q.cf; m.cfPpn = q.cfPpn;
    m.status = 'DITAHAN'; m.fundedAt = now(); m.method = method || 'QRIS';
    post(`Pendanaan ${c.no}: ${m.title}`, [{ acc: 'KAS', dr: q.clientTotal }, { acc: 'HELD', cr: q.clientTotal }], c.id);
    audit(user(uid).name, 'Mendanai termin', `${c.no} ${rpTxt(q.clientTotal)} via ${m.method}`); save(); return ok(m);
  };
  const submitWork = (uid, cid, mid, note) => {
    const c = getC(cid); if (!c || c.freelancerId !== uid) return err('Hanya freelancer kontrak ini yang dapat mengirim hasil.');
    const m = getM(c, mid); if (!m || m.status !== 'DITAHAN') return err('Termin ini belum didanai atau sudah dikirim.');
    if (clean(note).length < 10) return err('Jelaskan hasil yang dikirim, minimal 10 huruf.');
    m.status = 'DIKIRIM'; m.submittedAt = now(); m.note = clean(note);
    audit(user(uid).name, 'Mengirim hasil kerja', `${c.no}: ${m.title}`); save(); return ok(m);
  };
  const askRevision = (uid, cid, mid, note) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien yang dapat meminta revisi.');
    const m = getM(c, mid); if (!m || m.status !== 'DIKIRIM') return err('Termin ini tidak sedang menunggu tinjauan.');
    if (clean(note).length < 10) return err('Jelaskan bagian yang perlu diperbaiki, minimal 10 huruf.');
    m.status = 'DITAHAN'; m.revisions += 1; m.revisionNote = clean(note); delete m.submittedAt;
    audit(user(uid).name, 'Meminta revisi', `${c.no}: ${m.title}`); save(); return ok(m);
  };
  /* cairkan bagian a dari nilai termin; biaya klien ikut proporsional */
  const release = (c, m, a, by) => {
    const f = user(c.freelancerId), P = pol();
    const ff = bpsOf(a, c.ffBps), ffPpn = Math.floor(ff * c.ppnPct / 100);
    const cfp = a === m.amount ? (m.cf || 0) : Math.floor((m.cf || 0) * a / m.amount);
    const cfpp = a === m.amount ? (m.cfPpn || 0) : Math.floor((m.cfPpn || 0) * a / m.amount);
    const pph = P.pph22Active && !f.pph22Stmt ? Math.floor(a * P.pph22Pct / 100) : 0;
    const net = a - ff - ffPpn - pph;
    const hold = isMember(f) ? P.holdDaysMember : P.holdDaysPublic;
    if (a > 0) {
      post(`Pencairan ${c.no}: ${m.title}`, [{ acc: 'HELD', dr: a + cfp + cfpp }, { acc: 'SALDO', cr: net }, { acc: 'KOMISI', cr: ff }, { acc: 'KLIEN', cr: cfp }, { acc: 'PPN', cr: ffPpn + cfpp }, { acc: 'PPH', cr: pph }], c.id);
      S.earnings.unshift({ id: id('e'), freelancerId: c.freelancerId, contractId: c.id, msId: m.id, gross: a, komisi: ff, ppn: ffPpn, pph, net, at: now(), availableAt: now() + hold * DAY });
    }
    m.paidOut = (m.paidOut || 0) + a + cfp + cfpp;
    m.komisi = (m.komisi || 0) + ff; m.cfEarned = (m.cfEarned || 0) + cfp; m.net = (m.net || 0) + net; m.paidAt = now(); m.releasedBy = by;
  };
  const refundRest = (c, m, memo) => {
    const back = heldOf(m) - (m.paidOut || 0);
    if (back > 0) post(memo, [{ acc: 'HELD', dr: back }, { acc: 'KAS', cr: back }], c.id);
    m.refund = back; return back;
  };
  const approve = (uid, cid, mid) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien yang dapat menyetujui hasil.');
    const m = getM(c, mid); if (!m || m.status !== 'DIKIRIM') return err('Belum ada hasil kerja untuk disetujui.');
    release(c, m, m.amount, user(uid).name); m.status = 'CAIR'; settle(c);
    audit(user(uid).name, 'Menyetujui hasil, dana cair', `${c.no} ${rpTxt(m.amount)}, biaya layanan ${rpTxt(m.komisi + m.cfEarned)}`); save(); return ok(m);
  };
  const refundByFreelancer = (uid, cid, mid) => {
    const c = getC(cid); if (!c || c.freelancerId !== uid) return err('Hanya freelancer yang dapat mengembalikan dana.');
    const m = getM(c, mid); if (!m || !['DITAHAN', 'DIKIRIM'].includes(m.status)) return err('Termin ini tidak dapat dikembalikan.');
    const back = refundRest(c, m, `Pengembalian ${c.no}: ${m.title}`);
    m.status = 'DIKEMBALIKAN'; settle(c);
    audit(user(uid).name, 'Mengembalikan dana ke klien', `${c.no} ${rpTxt(back)} utuh, termasuk biaya layanan dan PPN`); save(); return ok(m);
  };
  const cancelUnfunded = (uid, cid, mid) => {
    const c = getC(cid); if (!c || (c.clientId !== uid && c.freelancerId !== uid)) return err('Anda bukan pihak kontrak ini.');
    const m = getM(c, mid); if (!m || m.status !== 'BELUM_DANA') return err('Hanya termin yang belum didanai yang dapat dibatalkan.');
    m.status = 'DIKEMBALIKAN'; m.refund = 0; settle(c);
    audit(user(uid).name, 'Membatalkan termin', `${c.no}: ${m.title}`); save(); return ok(m);
  };

  /* ---------- sengketa ---------- */
  const openDispute = (uid, cid, mid, reason) => {
    const c = getC(cid); if (!c || (c.clientId !== uid && c.freelancerId !== uid)) return err('Anda bukan pihak kontrak ini.');
    const m = getM(c, mid); if (!m || !['DITAHAN', 'DIKIRIM'].includes(m.status)) return err('Sengketa hanya untuk termin yang dananya sedang ditahan.');
    if (clean(reason).length < 20) return err('Jelaskan masalahnya minimal 20 huruf.');
    m.prevStatus = m.status; m.status = 'SENGKETA'; c.status = 'SENGKETA';
    const d = { id: id('d'), contractId: cid, msId: mid, by: uid, reason: profane(clean(reason)).masked, status: 'TERBUKA', at: now() };
    S.disputes.unshift(d);
    audit(user(uid).name, 'Membuka sengketa', `${c.no}: ${m.title}`); save(); return ok(d);
  };
  const resolveDispute = (admin, did, toFreelancer, note) => {
    const d = S.disputes.find((x) => x.id === did); if (!d || d.status !== 'TERBUKA') return err('Sengketa ini sudah ditutup.');
    const c = getC(d.contractId), m = getM(c, d.msId);
    const a = num(toFreelancer);
    if (a > m.amount) return err('Bagian freelancer melebihi nilai termin.');
    if (clean(note).length < 20) return err('Tulis dasar keputusan minimal 20 huruf. Kedua pihak akan membacanya.');
    if (a > 0) release(c, m, a, admin);
    const back = refundRest(c, m, `Pengembalian sengketa ${c.no}: ${m.title}`);
    m.status = a > 0 ? 'CAIR' : 'DIKEMBALIKAN';
    d.status = 'SELESAI'; d.resolution = { toFreelancer: a, toClient: back, note: clean(note), admin, at: now() };
    c.status = 'AKTIF'; settle(c);
    audit(admin, 'Memutus sengketa', `${c.no}: freelancer ${rpTxt(a)}, kembali ke klien ${rpTxt(back)}`); save(); return ok(d);
  };

  /* ---------- percakapan, interview & laporan ---------- */
  const OFFSITE = /(\+?62|08)[\d\s-]{8,}|wa\.me|whats\s?app|@[a-z0-9.-]+\.[a-z]{2,}|telegram/i;
  const thread = (tid) => S.threads.find((t) => t.id === tid);
  const threadOfContract = (cid) => S.threads.find((t) => t.contractId === cid);
  const isParty = (t, uid) => t && (t.clientId === uid || t.freelancerId === uid);
  const sys = (t, text) => { S.msgs.push({ id: id('s'), thread: t.id, from: 'SISTEM', text, at: now(), flags: [] }); t.lastAt = now(); };
  const newThread = (o) => { const t = { id: id('t'), status: 'TERBUKA', at: now(), lastAt: now(), ...o }; S.threads.unshift(t); return t; };
  const active = (uid) => { const u = user(uid); return u && u.status === 'AKTIF'; };
  const openInterview = (cid, pid) => {
    const p = S.proposals.find((x) => x.id === pid); if (!p) return err('Proposal tidak ditemukan.');
    const j = S.jobs.find((x) => x.id === p.jobId); if (!j || j.clientId !== cid) return err('Hanya pemilik lowongan yang dapat mengajak interview.');
    if (!active(cid)) return err('Akun Anda sedang ditangguhkan.');
    const ex = S.threads.find((t) => t.proposalId === pid);
    if (ex) return ex.status === 'TERBUKA' ? ok(ex) : err('Ruang interview ini sudah ditutup dan tidak dapat dibuka kembali.');
    if (p.status !== 'TERKIRIM') return err('Proposal ini sudah tidak aktif.');
    const t = newThread({ kind: 'INTERVIEW', clientId: cid, freelancerId: p.freelancerId, jobId: j.id, proposalId: pid });
    sys(t, `${user(cid).name} mengajak interview untuk "${j.title}". Percakapan ini diawasi Ariba Indonesia.`);
    audit(user(cid).name, 'Membuka ruang interview', `${j.title} dengan ${user(p.freelancerId).name}`); save(); return ok(t);
  };
  const send = (uid, tid, text) => {
    const t = thread(tid); if (!isParty(t, uid)) return err('Anda bukan peserta percakapan ini.');
    if (t.status !== 'TERBUKA') return err('Percakapan ini sudah ditutup.');
    if (!active(uid)) return err('Akun Anda sedang ditangguhkan sehingga tidak dapat mengirim pesan.');
    const raw = clean(text); if (!raw) return err('Tulis pesan terlebih dahulu.');
    const pf = profane(raw), flags = [];
    if (pf.hit) flags.push('KASAR');
    if (OFFSITE.test(raw)) flags.push('KONTAK_LUAR');
    S.msgs.push({ id: id('s'), thread: tid, from: uid, text: pf.masked, at: now(), flags }); t.lastAt = now();
    if (pf.hit) { const u = user(uid); u.rudeCount = (u.rudeCount || 0) + 1; audit('Sistem', 'Kata kasar disensor ARIBA-NK-007', `${u.name}, ${pf.count} kata`); }
    save(); return ok({ flags });
  };
  const scheduleInterview = (cid, tid, v) => {
    const t = thread(tid); if (!t || t.clientId !== cid) return err('Hanya pemberi kerja yang dapat menjadwalkan interview.');
    if (t.status !== 'TERBUKA') return err('Percakapan ini sudah ditutup.');
    const when = new Date(`${v.date}T${v.time || '09:00'}:00+07:00`).getTime();
    if (!when || isNaN(when)) return err('Isi tanggal dan jam interview.');
    if (when < now()) return err('Waktu interview harus di masa depan.');
    const mode = v.mode === 'VIDEO' ? 'Panggilan video' : v.mode === 'TELEPON' ? 'Telepon' : 'Chat Narakarya';
    t.interview = { when, mode, link: clean(v.link), status: 'DIUSULKAN' };
    sys(t, `Interview diusulkan ${new Date(when).toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short', timeZone: 'Asia/Jakarta' })} WIB lewat ${mode}${t.interview.link ? ` (${t.interview.link})` : ''}.`);
    save(); return ok(t);
  };
  const confirmInterview = (fid, tid, yes) => {
    const t = thread(tid); if (!t || t.freelancerId !== fid || !t.interview || t.interview.status !== 'DIUSULKAN') return err('Tidak ada jadwal yang menunggu konfirmasi.');
    t.interview.status = yes ? 'DIKONFIRMASI' : 'MINTA_JADWAL_LAIN';
    sys(t, yes ? `${user(fid).name} mengonfirmasi jadwal interview.` : `${user(fid).name} meminta jadwal lain.`); save(); return ok(t);
  };
  const closeThread = (uid, tid, reason) => {
    const t = thread(tid); if (!isParty(t, uid)) return err('Anda bukan peserta percakapan ini.');
    if (t.status !== 'TERBUKA') return err('Percakapan ini sudah ditutup.');
    if (t.kind === 'KONTRAK') return err('Percakapan kontrak tetap terbuka selama Anda bekerja sama. Bila ada masalah, laporkan ke Ariba Indonesia.');
    t.status = 'DITUTUP'; t.closedBy = uid; t.closedReason = clean(reason) || 'Tanpa alasan'; t.closedAt = now();
    sys(t, `${user(uid).name} menutup ruang interview. Alasan: ${profane(t.closedReason).masked}`);
    audit(user(uid).name, 'Menutup ruang interview', t.closedReason); save(); return ok(t);
  };
  const report = (uid, tid, reason, alsoClose) => {
    const t = thread(tid); if (!isParty(t, uid)) return err('Anda bukan peserta percakapan ini.');
    if (clean(reason).length < 10) return err('Jelaskan apa yang Anda laporkan, minimal 10 huruf.');
    if (S.reports.some((r) => r.threadId === tid && r.by === uid && r.status === 'TERBUKA')) return err('Laporan Anda untuk percakapan ini sedang ditinjau.');
    const against = uid === t.clientId ? t.freelancerId : t.clientId;
    const r = { id: id('l'), threadId: tid, by: uid, against, reason: profane(clean(reason)).masked, status: 'TERBUKA', at: now() };
    S.reports.unshift(r);
    sys(t, `${user(uid).name} melaporkan percakapan ini ke Ariba Indonesia.`);
    audit(user(uid).name, 'Melaporkan percakapan', `tentang ${user(against).name}`);
    if (alsoClose && t.kind === 'INTERVIEW' && t.status === 'TERBUKA') { t.status = 'DITUTUP'; t.closedBy = uid; t.closedReason = 'Dilaporkan'; t.closedAt = now(); }
    save(); return ok(r);
  };
  const adminCloseThread = (admin, tid, reason) => {
    const t = thread(tid); if (!t) return err('Percakapan tidak ditemukan.');
    if (t.status !== 'TERBUKA') return err('Percakapan ini sudah ditutup.');
    if (clean(reason).length < 10) return err('Tulis alasan penutupan, minimal 10 huruf. Kedua pihak akan membacanya.');
    t.status = 'DITUTUP'; t.closedBy = 'ADMIN'; t.closedReason = clean(reason); t.closedAt = now();
    sys(t, `Ariba Indonesia menutup percakapan ini. Alasan: ${t.closedReason}`);
    audit(admin, 'Menutup percakapan', t.closedReason); save(); return ok(t);
  };
  const resolveReport = (admin, rid, action, note) => {
    const r = S.reports.find((x) => x.id === rid); if (!r || r.status !== 'TERBUKA') return err('Laporan ini sudah ditindaklanjuti.');
    if (clean(note).length < 10) return err('Tulis catatan tindak lanjut minimal 10 huruf.');
    const t = thread(r.threadId);
    if (action === 'TANGGUHKAN') { const x = setUserStatus(admin, r.against, 'DITANGGUHKAN', note); if (!x.ok) return x; }
    if ((action === 'TANGGUHKAN' || action === 'TUTUP') && t.status === 'TERBUKA') { t.status = 'DITUTUP'; t.closedBy = 'ADMIN'; t.closedReason = clean(note); t.closedAt = now(); sys(t, `Ariba Indonesia menutup percakapan ini. Alasan: ${clean(note)}`); }
    r.status = action === 'ABAIKAN' ? 'DITOLAK' : 'DITINDAK'; r.action = action; r.note = clean(note); r.admin = admin; r.doneAt = now();
    if (action !== 'ABAIKAN') { const u = user(r.against); u.upheld = (u.upheld || 0) + 1; }
    audit(admin, 'Menindaklanjuti laporan', `${action} terhadap ${user(r.against).name}`); save(); return ok(r);
  };

  /* ---------- progres kerja ---------- */
  const postProgress = (uid, cid, mid, pct, note) => {
    const c = getC(cid); if (!c || c.freelancerId !== uid) return err('Hanya freelancer kontrak ini yang dapat melaporkan progres.');
    const m = getM(c, mid); if (!m || m.status !== 'DITAHAN') return err('Progres dilaporkan untuk termin yang sedang dikerjakan.');
    const v = num(pct); if (v < 0 || v > 100) return err('Progres antara 0 dan 100 persen.');
    if (clean(note).length < 10) return err('Jelaskan apa yang sudah dikerjakan, minimal 10 huruf.');
    const rn = rude(note); if (rn) return rn;
    S.progress.unshift({ id: id('g'), contractId: cid, msId: mid, pct: v, note: clean(note), at: now() });
    const t = threadOfContract(cid); if (t) sys(t, `Progres "${m.title}": ${v}%. ${clean(note)}`);
    save(); return ok(v);
  };
  const msProgress = (c, m) => {
    if (m.status === 'CAIR' || m.status === 'DIKIRIM') return 100;
    if (m.status === 'BELUM_DANA') return 0;
    const g = S.progress.find((x) => x.contractId === c.id && x.msId === m.id); return g ? g.pct : 0;
  };
  const contractProgress = (c) => {
    const ms = c.milestones.filter((m) => m.status !== 'DIKEMBALIKAN'); const tot = ms.reduce((a, m) => a + m.amount, 0);
    return tot ? Math.round(ms.reduce((a, m) => a + m.amount * msProgress(c, m), 0) / tot) : 0;
  };

  /* ---------- peringkat ---------- */
  const rankOf = (uid) => {
    const u = user(uid); const r = ratingOf(uid);
    const pen = (u.upheld || 0) * 10 + (u.status !== 'AKTIF' ? 30 : 0) + Math.min(10, (u.rudeCount || 0) * 2);
    if (u.kind === 'F') {
      const cs = S.contracts.filter((c) => c.freelancerId === uid);
      const ended = cs.filter((c) => ['SELESAI', 'DIBATALKAN'].includes(c.status));
      const lost = S.disputes.filter((d) => d.status === 'SELESAI' && getC(d.contractId).freelancerId === uid && d.resolution.toFreelancer * 2 < getM(getC(d.contractId), d.msId).amount).length;
      const good = ended.filter((c) => c.status === 'SELESAI').length;
      const jss = ended.length ? Math.max(0, Math.round((good - lost) / ended.length * 100)) : null;
      const earned = S.earnings.filter((e) => e.freelancerId === uid).reduce((a, e) => a + e.gross, 0);
      const base = jss === null ? null : Math.round(0.5 * jss + 0.5 * (r.n ? r.avg / 5 * 100 : jss));
      const score = base === null ? null : Math.max(0, base - pen);
      let tier = 'Baru';
      if (score !== null) tier = score >= 90 && good >= 10 && earned >= 20e6 ? 'Terbaik Plus' : score >= 90 && good >= 3 && earned >= 5e6 ? 'Terbaik' : score >= 80 ? 'Naik Daun' : 'Terdaftar';
      return { kind: 'F', score, tier, jss, rating: r, done: good, earned, pen };
    }
    const jobs = S.jobs.filter((j) => j.clientId === uid && !['DITOLAK', 'TINJAUAN'].includes(j.status));
    const cs = S.contracts.filter((c) => c.clientId === uid);
    const hireRate = jobs.length ? Math.min(1, cs.filter((c) => c.jobId).length / jobs.length) : 0;
    const spent = cs.flatMap((c) => c.milestones).filter((m) => m.status === 'CAIR').reduce((a, m) => a + m.amount, 0);
    const funded = payVerified(u);
    const score = cs.length ? Math.max(0, Math.round(0.5 * (r.n ? r.avg / 5 * 100 : 80) + 0.3 * hireRate * 100 + 0.2 * Math.min(1, spent / 20e6) * 100) - pen) : null;
    const tier = score === null ? (idVerified(u) ? 'Klien baru' : 'Belum terverifikasi') : score >= 85 && cs.length >= 5 && spent >= 20e6 ? 'Klien utama' : score >= 60 && funded ? 'Klien tepercaya' : 'Klien terdaftar';
    return { kind: 'K', score, tier, hireRate, spent, funded, hires: cs.length, jobs: jobs.length, rating: r, pen };
  };

  const review = (uid, cid, stars, text) => {
    const c = getC(cid); if (!c || c.status !== 'SELESAI') return err('Ulasan dibuka setelah kontrak selesai.');
    if (c.clientId !== uid && c.freelancerId !== uid) return err('Anda bukan pihak kontrak ini.');
    if (S.reviews.some((r) => r.contractId === cid && r.from === uid)) return err('Anda sudah memberi ulasan.');
    const s = num(stars); if (s < 1 || s > 5) return err('Pilih 1 sampai 5 bintang.');
    if (clean(text).length < 10) return err('Tulis ulasan minimal 10 huruf.');
    const rr = rude(text); if (rr) return rr;
    S.reviews.unshift({ id: id('r'), contractId: cid, from: uid, to: uid === c.clientId ? c.freelancerId : c.clientId, stars: s, text: clean(text), at: now() });
    save(); return ok(true);
  };
  const ratingOf = (uid) => {
    const r = S.reviews.filter((x) => x.to === uid);
    return r.length ? { avg: r.reduce((a, x) => a + x.stars, 0) / r.length, n: r.length } : { avg: 0, n: 0 };
  };

  /* ---------- penghasilan & pencairan ---------- */
  const balance = (fid) => {
    const e = S.earnings.filter((x) => x.freelancerId === fid);

const go = (h) => { if (location.hash === '#' + h) render(); else location.hash = h; };
const toast = (t, bad) => { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.setAttribute('role', 'status'); el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), bad ? 5200 : 3000); };
const done = (r, msg, after) => { if (!r.ok) { toast(r.error, true); return false; } if (msg) toast(msg); closeModal(); if (after) go(after); else render(); return true; };
const modal = (html) => { closeModal(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; document.body.append(o); o.addEventListener('click', (e) => { if (e.target === o) closeModal(); }); const f = $('input,textarea,select,button', o); if (f) f.focus(); };
function closeModal() { const o = $('#ov'); if (o) o.remove(); }
const need = (kind) => { const u = NK.me(); if (!u) { toast('Masuk dulu untuk melanjutkan.'); go('masuk'); return null; } if (kind && u.kind !== kind) { toast(kind === 'F' ? 'Fitur ini untuk akun freelancer.' : 'Fitur ini untuk akun pemberi kerja.', true); return null; } return u; };
const METHODS = ['QRIS', 'VA BCA', 'VA BRI', 'VA Mandiri', 'Dompet digital'];
const methodPick = (member) => [...(member ? ['Dompet ARIBA'] : []), ...METHODS].map((x, i) => `<label class="choice"><input type="radio" name="method" value="${x}" ${i ? '' : 'checked'}><span>${x}</span></label>`).join('');

/* ---------- rincian biaya ---------- */
const qFor = (amount, cat, fu, cu) => NK.quote(amount, NK.feesFor(cat, NK.isMember(fu), NK.isMember(cu)));
const fLines = (q) => `<div><span>Harga</span><span>${rp(q.amount)}</span></div><div><span>Biaya layanan ${pc(q.ffPct)}</span><span>−${rp(q.ff)}</span></div><div><span>PPN ${pc(q.ppnPct)} atas biaya layanan</span><span>−${rp(q.ffPpn)}</span></div><div class="t"><span>Freelancer terima</span><span>${rp(q.net)}</span></div>`;
const cLines = (q) => `<div><span>Nilai pekerjaan</span><span>${rp(q.amount)}</span></div><div><span>Biaya layanan klien ${pc(q.cfPct)}</span><span>${rp(q.cf)}</span></div><div><span>PPN ${pc(q.ppnPct)} atas biaya layanan</span><span>${rp(q.cfPpn)}</span></div><div class="t"><span>Klien bayar</span><span>${rp(q.clientTotal)}</span></div>`;

/* ---------- kerangka ---------- */
function header(route) {
  const u = NK.me();
  const L = [['talenta', 'Cari Talenta'], ['lowongan', 'Cari Kerja'], ['jasa', 'Jasa Siap Pesan'], ['peringkat', 'Peringkat'], ['harga', 'Harga & Kredit']];
  return `<div class="flag" aria-hidden="true"></div><div class="strip"><div class="wrap"><span><strong>Prototipe.</strong> Data contoh tersimpan di peramban Anda. Tidak ada uang sungguhan.</span><button class="linkbtn" data-a="reset">Mulai ulang data contoh</button></div></div>
  ${u && u.status !== 'AKTIF' ? `<div class="note bad" style="border-radius:0;text-align:center">Akun Anda ditangguhkan Ariba Indonesia${u.statusReason ? ': ' + esc(u.statusReason) : ''}. Anda tidak dapat melamar, memasang, atau mengirim pesan.</div>` : ''}
  <header class="top"><div class="wrap">
    <a class="brand" href="#beranda" aria-label="Narakarya, beranda"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="16" rx="0" fill="#C8102E"/><rect y="16" width="32" height="16" fill="#FFFFFF" stroke="#E4D6D2"/><rect x="0.5" y="0.5" width="31" height="31" rx="5" fill="none" stroke="#C8102E"/></svg><span><b>Narakarya</b><i>OLEH ARIBA INDONESIA</i></span></a>
    <button class="burger" data-a="burger" aria-label="Buka menu">${ic('menu')}</button>
    <nav class="nav" id="nav" aria-label="Navigasi utama">${L.map(([h, t]) => `<a href="#${h}" class="${route === h ? 'on' : ''}">${t}</a>`).join('')}${u ? '' : '<a class="only-m" href="#daftar">Daftar gratis</a>'}</nav>
    <div class="acts">${u
      ? `${u.role === 'ADMIN' ? '<a class="btn s" href="#admin">Dashboard admin</a>' : `${u.kind === 'F' ? `<a class="btn s" href="#kredit" title="Sisa kredit">${NK.credits(u.id).total} kredit</a>` : ''}<a class="btn s" href="#ruang">Ruang kerja</a>`}<button class="btn s" data-a="logout" aria-label="Keluar">${ic('out')}</button>`
      : '<a class="btn s" href="#masuk">Masuk</a><a class="btn pri s" href="#daftar">Daftar gratis</a>'}</div>
  </div></header>`;
}
const footer = () => `<footer class="foot"><div class="wrap"><div><strong style="color:#fff">Narakarya</strong><br>Kerja lepas tanpa bunga dan tanpa denda.<br>Dikelola Ariba Indonesia.</div>
<div class="stack-s"><a href="#harga">Harga dan kredit</a><a href="#peringkat">Peringkat</a><a href="#aturan">Aturan Narakarya</a></div>
<div class="stack-s"><a href="#admin">Dashboard pengelola</a><a href="https://ariba.id/">ariba.id</a><a href="https://ariba.id/demo/">ARIBA Cooperative OS</a></div></div></footer>`;

const jobCard = (j) => { const c = NK.user(j.clientId); const n = NK.S.proposals.filter((p) => p.jobId === j.id).length; return `<a class="card stack-s" href="#lowongan-${j.id}">
  <div class="row between"><span class="tag">${esc(j.cat)}</span><span class="muted xs">${ago(j.at)}</span></div>
  <h3>${esc(j.title)}</h3><p class="muted small clamp2">${esc(j.desc)}</p>
  <div class="row between"><span class="price">${rp(j.budget)}</span><span class="muted xs">${j.days} hari · ${n} proposal · ${NK.creditCost(j.budget)} kredit</span></div>
  <div class="row small"><span class="muted">${esc(c.name)}</span>${tierPill(c.id)}${mBadge(c)}</div><div class="row xs">${vBadges(c)}</div></a>`; };
const talentCard = (u) => { const r = NK.rankOf(u.id); return `<a class="card stack-s" href="#talenta-${u.id}">
  <div class="row" style="flex-wrap:nowrap">${av(u)}<div class="grow"><strong class="nm">${esc(u.name)}</strong><div class="muted xs">${esc(u.city)}</div></div>${plusBadge(u)}</div>
  <div class="small clamp2">${esc(u.headline)}</div>
  <div class="row between small"><span>${stars(u.id)}</span><span class="muted">${r.done} kontrak${r.jss !== null ? ` · sukses ${r.jss}%` : ''}</span></div>
  <div class="row small">${tierPill(u.id)}${mBadge(u)}</div>
  <div class="price small">${rp(u.rate)}<span class="muted" style="font-weight:400">/jam acuan</span></div></a>`; };
const serviceCard = (s) => { const f = NK.user(s.freelancerId); return `<a class="card stack-s" href="#jasa-${s.id}"><span class="tag" style="align-self:flex-start">${esc(s.cat)}</span><h3>${esc(s.title)}</h3>
  <div class="row small">${av(f, 'sm')}<span class="muted">${esc(f.name)}</span></div>
  <div class="row between small"><span>${stars(f.id)}</span><span class="price">mulai ${rp(Math.min(...s.tiers.map((t) => t.price)))}</span></div><div class="row small">${tierPill(f.id)}${mBadge(f)}</div></a>`; };
const talents = () => NK.S.users.filter((u) => u.kind === 'F' && u.status === 'AKTIF' && u.headline);
const sortTalents = (a) => a.slice().sort((x, y) => ((NK.rankOf(y.id).score ?? -1) - (NK.rankOf(x.id).score ?? -1)) || (NK.isMember(y) - NK.isMember(x)) || (NK.ratingOf(y.id).n - NK.ratingOf(x.id).n));
const openJobs = () => NK.S.jobs.filter((j) => j.status === 'TERBUKA');
const liveServices = () => NK.S.services.filter((s) => s.status === 'TAYANG');

/* ---------- beranda ---------- */
