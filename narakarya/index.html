<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#182B3A">
<title>Narakarya</title>
<meta name="description" content="Narakarya: tempat kerja lepas oleh Ariba Indonesia. Cari freelancer atau pekerjaan, dana ditahan aman, tanpa bunga dan tanpa denda.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<style>/* Tata letak: pasar kerja padat dengan "nota kontrak" sebagai ciri khas; setiap rupiah terurai jelas.
   Warna dan huruf mengikuti ariba.id. Sengaja satu tema terang, sama seperti situs induknya. */
:root{
  color-scheme:light;
  --navy:#182B3A;--navy2:#22394C;--navy3:#4A6175;--navy-soft:#EEF1F4;--mist:#B9C4CE;
  --wine:#7E293C;--wine-d:#5E1E2D;--wine-soft:#F7ECEE;
  --sea:#2F7A69;--sea-soft:#EAF2EF;
  --ok:#2E7D4F;--ok-soft:#E8F3EC;--warn:#9A6410;--warn-soft:#FBF1DF;--bad:#B3261E;--bad-soft:#FBEAE9;
  --paper:#F7F5F0;--card:#FFFFFF;--line:#E2DDD3;--line2:#EEEAE2;--ink:#1C2430;--ink2:#4A5563;--ink3:#737C87;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--navy);text-wrap:balance;letter-spacing:-.005em}
a{color:var(--wine)}a:hover{color:var(--wine-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.small{font-size:13px}.xs{font-size:12px}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}.stack-s{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}.between{justify-content:space-between}
.grow{flex:1 1 0;min-width:0}

/* strip & header */
.strip{background:var(--warn-soft);color:#5f3f0b;font-size:12.5px;border-bottom:1px solid #EFDFC0}
.strip .wrap{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding-block:6px}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#F7F5F0}
.top .wrap{display:flex;align-items:center;gap:8px 22px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;color:#F7F5F0;text-decoration:none}
.brand:hover{color:#fff}
.brand b{font:600 20px/1 var(--serif);letter-spacing:.02em;display:block}
.brand i{font:normal 9.5px/1 var(--sans);letter-spacing:.2em;color:var(--mist);display:block;margin-top:4px}
.nav{display:flex;flex-wrap:wrap;gap:2px 18px;flex:1 1 auto}
.nav a{color:#D5DDE4;text-decoration:none;font-size:14px;padding:8px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:#fff}.nav a.on{border-bottom-color:#C9717F}
.acts{display:flex;align-items:center;gap:8px}
.burger{display:none;background:none;border:1px solid var(--navy3);border-radius:6px;color:#fff;width:42px;height:42px;cursor:pointer}
@media(max-width:860px){.nav{display:none;order:9;flex:1 1 100%;flex-direction:column;padding-bottom:6px}.nav.open{display:flex}.burger{display:inline-grid;place-items:center}.brand{flex:1}}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--navy3);color:var(--ink)}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}.btn.pri:hover{background:var(--wine-d);border-color:var(--wine-d);color:#fff}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:600}.btn.sea:hover{background:#25665a;color:#fff}
.btn.ghost{background:transparent;border-color:var(--navy3);color:#F7F5F0}.btn.ghost:hover{border-color:#fff;color:#fff}
.btn.danger{color:var(--bad);border-color:#E7BDBA}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.s{min-height:34px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{background:var(--navy);color:#F7F5F0}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:44px 64px}
.hero h1{color:#fff;font-size:clamp(34px,4.6vw,54px);line-height:1.08}
.hero p.lead{color:#D5DDE4;font-size:17px;max-width:56ch;margin-top:14px}
@media(max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:28px 40px}}
.searchbox{display:flex;gap:0;background:#fff;border-radius:8px;margin-top:22px;padding:5px;flex-wrap:wrap}
.searchbox select{border:0;background:var(--navy-soft);border-radius:5px;padding:0 10px;min-height:44px;color:var(--navy);font-size:14px;font-weight:500}
.searchbox input{flex:1 1 180px;min-width:0;border:0;padding:0 12px;min-height:44px;background:transparent;color:var(--ink);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:13px;color:var(--mist)}
.chips a{color:#D5DDE4;text-decoration:underline;text-underline-offset:3px}

/* nota */
.nota{background:var(--card);color:var(--ink);border-radius:4px;padding:20px 20px 16px;box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:14px}
.nota h3{font-size:16px;font-family:var(--sans);font-weight:600;color:var(--navy)}
.nota .no{font:500 11px var(--mono);color:var(--ink3);letter-spacing:.04em}
.lines{display:flex;flex-direction:column;margin-top:10px}
.lines>div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-top:1px dashed var(--line)}
.lines>div:first-child{border-top:0}
.lines .t{border-top:1px solid var(--navy);font-weight:600;color:var(--navy)}
.lines span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}

/* sections */
section.band{padding-block:44px}
.band.alt{background:var(--card);border-block:1px solid var(--line)}
.band.dark{background:var(--navy);color:#F7F5F0}.band.dark h2{color:#fff}
.sect-h{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:baseline;margin-bottom:20px}
h2{font-size:clamp(25px,3vw,32px);line-height:1.15}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:980px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}}
.catlist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 22px}
@media(max-width:980px){.catlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.catlist a{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none;font-weight:500;font-size:14px}
.catlist a:hover{color:var(--wine)}.catlist span{color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:400}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
a.card{display:block;text-decoration:none;color:inherit}a.card:hover{border-color:var(--navy3);color:inherit}
.card h3{font-size:17px;line-height:1.3}
.card.flat{border:0;padding:0;background:none}
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.price{font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--navy-soft);color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.wine{background:var(--wine-soft);color:var(--wine)}.pill.sea{background:var(--sea-soft);color:var(--sea)}
.badge-m{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--sea);white-space:nowrap}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;background:var(--navy3)}
.av.lg{width:72px;height:72px;font-size:24px}.av.sm{width:30px;height:30px;font-size:11.5px}
.star{color:var(--warn);font-weight:600;white-space:nowrap}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;counter-reset:s}
@media(max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps>div{counter-increment:s;border-top:2px solid var(--navy);padding-top:10px}
.steps>div::before{content:"Langkah " counter(s);font:500 11.5px var(--mono);color:var(--wine)}
.steps h3{font-size:18px;margin:4px 0}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:left;background:#FBFAF7;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tmin{min-width:720px}

/* layout dua kolom */
.page{padding-block:24px 56px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.split.l{grid-template-columns:250px minmax(0,1fr)}
@media(max-width:920px){.split,.split.l{grid-template-columns:minmax(0,1fr)}}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:6px}.crumb a{color:var(--ink2)}
.title{font-size:clamp(25px,3.2vw,32px);line-height:1.15}

/* form */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink);min-width:0}
label.f small{font-weight:400;color:var(--ink2)}
input.in,select.in,textarea.in{width:100%;min-height:42px;border:1px solid #CFC9BD;border-radius:6px;background:#fff;padding:8px 11px;font-size:15px;font-weight:400}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.x3{grid-template-columns:repeat(3,minmax(0,1fr))}.fgrid.x4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:620px){.fgrid,.fgrid.x3,.fgrid.x4{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:1/-1}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#fff}
.choice:has(input:checked){border-color:var(--sea);background:var(--sea-soft)}
.note{border-radius:6px;padding:10px 12px;font-size:13.5px;background:var(--navy-soft);color:var(--navy)}
.note.warn{background:var(--warn-soft);color:#6b470c}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.sea{background:var(--sea-soft);color:#1f5a4d}.note.ok{background:var(--ok-soft);color:#1f5e39}

/* subnav */
.sub{background:var(--card);border-bottom:1px solid var(--line)}
.sub .wrap{display:flex;gap:4px 20px;overflow-x:auto;scrollbar-width:none}
.sub a{padding:12px 0;font-size:14px;color:var(--ink2);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.sub a.on{color:var(--navy);font-weight:600;border-bottom-color:var(--wine)}

/* termin */
.ms{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:14px}
.ms+.ms{margin-top:10px}
.thread{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.bub{max-width:88%;padding:8px 11px;border-radius:8px;background:var(--navy-soft);font-size:14px;overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;background:var(--sea-soft)}
.bub small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}

/* admin */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:70vh}
.adm-side{background:var(--navy2);color:#D5DDE4;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.adm-side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#D5DDE4;text-decoration:none;font-size:14px}
.adm-side a:hover{background:var(--navy);color:#fff}.adm-side a.on{background:var(--navy);color:#fff;font-weight:600}
.adm-side em{margin-left:auto;font-style:normal;font:500 11.5px var(--mono);background:var(--wine);color:#fff;border-radius:999px;padding:1px 7px}
.adm-main{padding:22px clamp(16px,3vw,32px) 56px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media(max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}.adm-side{flex-direction:row;overflow-x:auto;padding:8px}.adm-side a{white-space:nowrap}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi span{font-size:12.5px;color:var(--ink2);display:block}
.kpi b{display:block;font:600 clamp(19px,2.3vw,24px)/1.25 var(--sans);color:var(--navy);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--ink3);font-size:12px}
.bars text{font:11px var(--sans);fill:var(--ink2)}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(24,43,58,.55);z-index:40;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--card);border-radius:8px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 32px);overflow-y:auto}
.modal h3{font-size:20px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}

.persona{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.persona:hover{border-color:var(--navy3)}
.foot{background:var(--navy);color:var(--mist);font-size:13.5px}
.foot .wrap{padding-block:28px;display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:space-between}
.foot a{color:#D5DDE4}
details.q{border-bottom:1px solid var(--line);padding:12px 0}
details.q summary{cursor:pointer;font-weight:600;color:var(--navy)}
details.q p{margin-top:6px;color:var(--ink2);max-width:72ch}
@media(prefers-reduced-motion:no-preference){a.card,.btn{transition:border-color .12s,background .12s}}
.only-m{display:none}
@media(max-width:480px){.acts .btn.pri{display:none}.only-m{display:block}.brand i{letter-spacing:.14em}.searchbox button{flex:1 1 100%;margin-top:5px}.searchbox input{flex:1 1 150px}}
</style>
<div id="app"></div>
<noscript>Narakarya memerlukan JavaScript.</noscript>
<script>
/* ==========================================================================
   Narakarya: mesin data prototipe (berjalan di peramban, tanpa server).
   Nominal selalu Rupiah bulat. Setiap gerakan uang dicatat berpasangan.
   ========================================================================== */
const NK = (() => {
  const KEY = 'narakarya.demo.v1';
  const DAY = 864e5;
  let clock = null;
  const now = () => clock ?? Date.now();

  const POLICY0 = {
    version: 1,
    commissionPct: 20,
    quotaPublic: 10, quotaMember: 30,
    holdDaysPublic: 3, holdDaysMember: 0,
    payoutFeePublic: 2500, payoutFeeMember: 0,
    autoReleaseDays: 7,
    minMilestone: 50000, minPayout: 50000,
    blocked: ['judi', 'slot gacor', 'togel', 'pinjol', 'pinjaman online', 'bunga harian', 'pornografi', 'phishing', 'penipuan'],
    review: ['joki', 'followers palsu', 'ulasan palsu', 'skripsi', 'retas', 'kripto'],
  };

  const ACC = {
    KAS: '1-1000 Rekening penampung mitra pembayaran',
    HELD: '2-1000 Dana klien ditahan',
    SALDO: '2-2000 Saldo freelancer',
    PAYOUT: '2-3000 Pencairan diproses',
    KOMISI: '4-1000 Pendapatan komisi Ariba Indonesia',
    FEE: '4-2000 Pendapatan biaya transfer',
  };

  const CATS = ['Desain & Kreatif', 'Web & Aplikasi', 'Penulisan & Terjemahan', 'Pemasaran Digital', 'Video & Animasi', 'Akuntansi & Pajak', 'Administrasi & Data', 'Hukum & Perizinan', 'Konsultasi Usaha', 'Pelatihan & Mengajar'];

  const blank = () => ({
    seq: 100, session: null, policy: { ...POLICY0, blocked: [...POLICY0.blocked], review: [...POLICY0.review] },
    users: [], jobs: [], proposals: [], services: [], contracts: [], msgs: [], reviews: [],
    earnings: [], payouts: [], disputes: [], ledger: [], audit: [], invites: [],
  });
  let S = blank();

  /* ---------- penyimpanan ---------- */
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* mode privat: tetap jalan di memori */ } };
  const load = () => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) { try { S = JSON.parse(raw); sweep(); return; } catch (e) { /* data rusak: mulai ulang */ } }
    reset();
  };
  const reset = () => { S = blank(); seed(); clock = null; sweep(); save(); };

  /* ---------- utilitas ---------- */
  const ok = (value) => ({ ok: true, value });
  const err = (error, code) => ({ ok: false, error, code });
  const id = (p) => p + (++S.seq);
  const user = (u) => S.users.find((x) => x.id === u);
  const isMember = (u) => !!(u && u.member && u.member.status === 'AKTIF');
  const clean = (t) => String(t ?? '').trim();
  const num = (v) => Math.round(Number(String(v ?? '').replace(/[^\d]/g, '')) || 0);
  const pol = () => S.policy;

  const audit = (actor, action, detail) => {
    S.audit.unshift({ id: id('a'), at: now(), actor, action, detail });
  };

  const post = (memo, lines, ref) => {
    const dr = lines.reduce((a, l) => a + (l.dr || 0), 0);
    const cr = lines.reduce((a, l) => a + (l.cr || 0), 0);
    if (dr !== cr) throw new Error('Jurnal tidak seimbang: ' + memo);
    S.ledger.unshift({ id: id('j'), at: now(), memo, ref, lines: lines.filter((l) => (l.dr || l.cr)) });
  };

  const commissionOf = (amount, bps) => Math.floor(amount * bps / 10000);
  const split = (amount, pct = pol().commissionPct) => {
    const komisi = commissionOf(amount, Math.round(pct * 100));
    return { amount, komisi, net: amount - komisi };
  };

  const screen = (text) => {
    const t = ' ' + clean(text).toLowerCase() + ' ';
    const hit = (w) => t.includes(w.toLowerCase());
    const b = pol().blocked.find(hit);
    if (b) return { verdict: 'BLOCK', word: b };
    const r = pol().review.find(hit);
    if (r) return { verdict: 'REVIEW', word: r };
    return { verdict: 'ALLOW' };
  };

  /* ---------- akun ---------- */
  const register = ({ name, kind, city, email }) => {
    name = clean(name);
    if (name.length < 3) return err('Isi nama lengkap, minimal 3 huruf.');
    if (!['F', 'K'].includes(kind)) return err('Pilih apakah Anda mencari kerja atau mencari freelancer.');
    if (!/.+@.+\..+/.test(clean(email))) return err('Isi alamat email yang benar.');
    const u = { id: id('u'), name, kind, city: clean(city) || 'Indonesia', email: clean(email), status: 'AKTIF', kyc: 'BELUM', member: null, headline: '', skills: [], rate: 0, bio: '', cat: CATS[0], joinedAt: now() };
    S.users.push(u); S.session = u.id;
    audit(u.name, 'Pendaftaran akun', kind === 'F' ? 'Freelancer umum' : 'Klien umum');
    save(); return ok(u);
  };
  const login = (uid) => { S.session = uid; save(); };
  const logout = () => { S.session = null; save(); };
  const me = () => user(S.session);

  const saveProfile = (uid, p) => {
    const u = user(uid); if (!u) return err('Akun tidak ditemukan.');
    Object.assign(u, { headline: clean(p.headline), bio: clean(p.bio), city: clean(p.city), rate: num(p.rate), cat: p.cat || u.cat,
      skills: clean(p.skills).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 10) });
    save(); return ok(u);
  };
  const requestKyc = (uid) => {
    const u = user(uid);
    if (u.kyc === 'TERVERIFIKASI') return err('Identitas Anda sudah terverifikasi.');
    u.kyc = 'MENUNGGU'; u.kycAt = now();
    audit(u.name, 'Mengirim identitas', 'Menunggu tinjauan pengelola'); save(); return ok(u);
  };

  /* ---------- lowongan ---------- */
  const postJob = (cid, j) => {
    const u = user(cid);
    if (!u || u.status !== 'AKTIF') return err('Akun Anda sedang ditangguhkan.');
    const title = clean(j.title), desc = clean(j.desc), budget = num(j.budget);
    if (title.length < 10) return err('Judul minimal 10 huruf agar mudah dipahami.');
    if (desc.length < 30) return err('Jelaskan pekerjaannya minimal 30 huruf. Lingkup yang jelas mencegah sengketa.');
    if (budget < pol().minMilestone) return err('Anggaran minimal ' + pol().minMilestone.toLocaleString('id-ID') + ' rupiah.');
    const sc = screen(title + ' ' + desc);
    if (sc.verdict === 'BLOCK') {
      audit(u.name, 'Lowongan diblokir ARIBA-NK-003', `Kata "${sc.word}" pada "${title}"`); save();
      return err(`Lowongan tidak dapat ditayangkan karena memuat "${sc.word}". Narakarya menolak pekerjaan yang terkait riba, judi, penipuan, dan konten terlarang (ARIBA-NK-003).`, 'ARIBA-NK-003');
    }
    const job = { id: id('j'), clientId: cid, title, desc, budget, cat: j.cat || CATS[0], level: j.level || 'Menengah', days: num(j.days) || 14,
      skills: clean(j.skills).split(',').map((s) => s.trim()).filter(Boolean).slice(0, 8), at: now(), flag: sc.verdict === 'REVIEW' ? sc.word : null,
      status: (isMember(u) && sc.verdict === 'ALLOW') ? 'TERBUKA' : 'TINJAUAN' };
    S.jobs.unshift(job);
    audit(u.name, 'Memasang lowongan', `${title} (${job.status})`); save();
    return ok(job);
  };
  const moderateJob = (admin, jid, approve, reason) => {
    const j = S.jobs.find((x) => x.id === jid); if (!j) return err('Lowongan tidak ditemukan.');
    if (!approve && clean(reason).length < 10) return err('Tulis alasan penolakan, minimal 10 huruf.');
    j.status = approve ? 'TERBUKA' : 'DITOLAK'; j.reason = clean(reason); j.flag = approve ? null : j.flag;
    audit(admin, approve ? 'Menyetujui lowongan' : 'Menolak lowongan', j.title + (reason ? ': ' + reason : '')); save(); return ok(j);
  };
  const closeJob = (cid, jid) => {
    const j = S.jobs.find((x) => x.id === jid && x.clientId === cid); if (!j) return err('Lowongan tidak ditemukan.');
    j.status = 'DITUTUP';
    S.proposals.filter((p) => p.jobId === jid && p.status === 'TERKIRIM').forEach((p) => { p.status = 'DITOLAK'; });
    audit(user(cid).name, 'Menutup lowongan', j.title); save(); return ok(j);
  };

  /* ---------- proposal ---------- */
  const quotaOf = (u) => (isMember(u) ? pol().quotaMember : pol().quotaPublic);
  const quotaUsed = (fid) => {
    const d = new Date(now()); const m0 = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    return S.proposals.filter((p) => p.freelancerId === fid && p.at >= m0).length;
  };
  const propose = (fid, jid, p) => {
    const u = user(fid), j = S.jobs.find((x) => x.id === jid);
    if (!u || u.status !== 'AKTIF') return err('Akun Anda sedang ditangguhkan.');
    if (!j || j.status !== 'TERBUKA') return err('Lowongan ini sudah tidak menerima lamaran.');
    if (j.clientId === fid) return err('Anda tidak dapat melamar lowongan sendiri.');
    if (S.proposals.some((x) => x.jobId === jid && x.freelancerId === fid && x.status !== 'DITARIK')) return err('Anda sudah melamar lowongan ini.');
    if (quotaUsed(fid) >= quotaOf(u)) return err(`Kuota lamaran bulan ini (${quotaOf(u)}) sudah habis.${isMember(u) ? '' : ' Anggota koperasi mendapat ' + pol().quotaMember + ' lamaran per bulan.'}`);
    const cover = clean(p.cover), price = num(p.price), days = num(p.days);
    if (cover.length < 30) return err('Tulis surat lamaran minimal 30 huruf: apa yang akan Anda kerjakan dan pengalaman yang relevan.');
    if (price < pol().minMilestone) return err('Harga yang diajukan terlalu kecil.');
    if (days < 1) return err('Isi perkiraan lama pengerjaan dalam hari.');
    const x = { id: id('p'), jobId: jid, freelancerId: fid, cover, price, days, status: 'TERKIRIM', at: now() };
    S.proposals.unshift(x);
    audit(u.name, 'Mengirim proposal', j.title); save(); return ok(x);
  };
  const withdrawProposal = (fid, pid) => {
    const p = S.proposals.find((x) => x.id === pid && x.freelancerId === fid);
    if (!p || p.status !== 'TERKIRIM') return err('Proposal ini tidak dapat ditarik.');
    p.status = 'DITARIK'; save(); return ok(p);
  };
  const rejectProposal = (cid, pid) => {
    const p = S.proposals.find((x) => x.id === pid); if (!p) return err('Proposal tidak ditemukan.');
    const j = S.jobs.find((x) => x.id === p.jobId);
    if (!j || j.clientId !== cid || p.status !== 'TERKIRIM') return err('Proposal ini tidak dapat ditolak.');
    p.status = 'DITOLAK'; save(); return ok(p);
  };

  /* ---------- kontrak ---------- */
  const newContract = ({ clientId, freelancerId, title, jobId, serviceId, milestones }) => {
    const year = new Date(now()).getFullYear();
    const c = { id: id('k'), no: `NK-${year}-${String(S.contracts.length + 1).padStart(4, '0')}`, clientId, freelancerId, title, jobId: jobId || null, serviceId: serviceId || null,
      total: milestones.reduce((a, m) => a + m.amount, 0), commissionBps: Math.round(pol().commissionPct * 100), policyVersion: pol().version, status: 'AKTIF', at: now(),
      milestones: milestones.map((m) => ({ id: id('m'), title: m.title, amount: m.amount, days: m.days || null, status: 'BELUM_DANA', revisions: 0 })) };
    S.contracts.unshift(c);
    return c;
  };
  const acceptProposal = (cid, pid, rows) => {
    const p = S.proposals.find((x) => x.id === pid); if (!p || p.status !== 'TERKIRIM') return err('Proposal ini sudah tidak aktif.');
    const j = S.jobs.find((x) => x.id === p.jobId); if (!j || j.clientId !== cid) return err('Hanya pemilik lowongan yang dapat menerima proposal.');
    if (user(p.freelancerId).status !== 'AKTIF') return err('Akun freelancer ini sedang ditangguhkan.');
    const ms = rows.map((r) => ({ title: clean(r.title), amount: num(r.amount) })).filter((r) => r.title || r.amount);
    if (!ms.length) return err('Isi minimal satu termin.');
    if (ms.some((m) => m.title.length < 3)) return err('Setiap termin perlu judul hasil kerja yang jelas (ARIBA-NK-001).', 'ARIBA-NK-001');
    if (ms.some((m) => m.amount < pol().minMilestone)) return err(`Nilai tiap termin minimal Rp ${pol().minMilestone.toLocaleString('id-ID')}.`);
    const sum = ms.reduce((a, m) => a + m.amount, 0);
    if (sum !== p.price) return err(`Total termin harus sama dengan harga proposal (selisih Rp ${Math.abs(sum - p.price).toLocaleString('id-ID')}).`);
    p.status = 'DITERIMA'; j.status = 'TERISI';
    S.proposals.filter((x) => x.jobId === j.id && x.id !== p.id && x.status === 'TERKIRIM').forEach((x) => { x.status = 'DITOLAK'; });
    const c = newContract({ clientId: cid, freelancerId: p.freelancerId, title: j.title, jobId: j.id, milestones: ms });
    audit(user(cid).name, 'Menerima proposal', `${c.no} dengan ${user(p.freelancerId).name}`); save(); return ok(c);
  };
  const orderService = (cid, sid, tier) => {
    const s = S.services.find((x) => x.id === sid), u = user(cid);
    if (!s || s.status !== 'TAYANG') return err('Jasa ini tidak tersedia.');
    if (s.freelancerId === cid) return err('Anda tidak dapat memesan jasa sendiri.');
    const t = s.tiers[tier]; if (!t) return err('Pilih paket.');
    const c = newContract({ clientId: cid, freelancerId: s.freelancerId, title: `${s.title} (${t.name})`, serviceId: sid, milestones: [{ title: t.scope, amount: t.price, days: t.days }] });
    audit(u.name, 'Memesan jasa', c.no + ' ' + s.title); save(); return ok(c);
  };
  const getC = (cid) => S.contracts.find((c) => c.id === cid);
  const getM = (c, mid) => c.milestones.find((m) => m.id === mid);

  const settle = (c) => {
    if (c.milestones.every((m) => ['CAIR', 'DIKEMBALIKAN'].includes(m.status))) {
      c.status = c.milestones.some((m) => m.status === 'CAIR') ? 'SELESAI' : 'DIBATALKAN';
      c.closedAt = now();
    }
  };
  const fund = (uid, cid, mid, method) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien kontrak ini yang dapat mendanai termin.');
    const m = getM(c, mid); if (!m) return err('Termin tidak ditemukan.');
    if (m.status !== 'BELUM_DANA') return ok(m); /* idempoten: notifikasi ganda tidak memposting dua kali */
    m.status = 'DITAHAN'; m.fundedAt = now(); m.method = method || 'QRIS';
    post(`Pendanaan ${c.no}: ${m.title}`, [{ acc: 'KAS', dr: m.amount }, { acc: 'HELD', cr: m.amount }], c.id);
    audit(user(uid).name, 'Mendanai termin', `${c.no} Rp ${m.amount.toLocaleString('id-ID')} via ${m.method}`); save(); return ok(m);
  };
  const submitWork = (uid, cid, mid, note) => {
    const c = getC(cid); if (!c || c.freelancerId !== uid) return err('Hanya freelancer kontrak ini yang dapat mengirim hasil.');
    const m = getM(c, mid); if (!m || m.status !== 'DITAHAN') return err('Termin ini belum didanai atau sudah dikirim.');
    if (clean(note).length < 10) return err('Jelaskan hasil yang dikirim, minimal 10 huruf.');
    m.status = 'DIKIRIM'; m.submittedAt = now(); m.note = clean(note);
    audit(user(uid).name, 'Mengirim hasil kerja', `${c.no}: ${m.title}`); save(); return ok(m);
  };
  const askRevision = (uid, cid, mid, note) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien yang dapat meminta revisi.');
    const m = getM(c, mid); if (!m || m.status !== 'DIKIRIM') return err('Termin ini tidak sedang menunggu tinjauan.');
    if (clean(note).length < 10) return err('Jelaskan bagian yang perlu diperbaiki, minimal 10 huruf.');
    m.status = 'DITAHAN'; m.revisions += 1; m.revisionNote = clean(note); delete m.submittedAt;
    audit(user(uid).name, 'Meminta revisi', `${c.no}: ${m.title}`); save(); return ok(m);
  };
  const release = (c, m, amount, by) => {
    const s = commissionOf(amount, c.commissionBps), net = amount - s;
    const f = user(c.freelancerId);
    const hold = isMember(f) ? pol().holdDaysMember : pol().holdDaysPublic;
    if (amount > 0) {
      post(`Pencairan ${c.no}: ${m.title}`, [{ acc: 'HELD', dr: amount }, { acc: 'SALDO', cr: net }, { acc: 'KOMISI', cr: s }], c.id);
      S.earnings.unshift({ id: id('e'), freelancerId: c.freelancerId, contractId: c.id, msId: m.id, gross: amount, komisi: s, net, at: now(), availableAt: now() + hold * DAY });
    }
    m.komisi = (m.komisi || 0) + s; m.net = (m.net || 0) + net; m.paidAt = now(); m.releasedBy = by;
  };
  const approve = (uid, cid, mid) => {
    const c = getC(cid); if (!c || c.clientId !== uid) return err('Hanya klien yang dapat menyetujui hasil.');
    const m = getM(c, mid); if (!m || m.status !== 'DIKIRIM') return err('Belum ada hasil kerja untuk disetujui.');
    release(c, m, m.amount, user(uid).name); m.status = 'CAIR'; settle(c);
    audit(user(uid).name, 'Menyetujui hasil, dana cair', `${c.no} Rp ${m.amount.toLocaleString('id-ID')}, komisi Rp ${m.komisi.toLocaleString('id-ID')}`); save(); return ok(m);
  };
  const refundByFreelancer = (uid, cid, mid) => {
    const c = getC(cid); if (!c || c.freelancerId !== uid) return err('Hanya freelancer yang dapat mengembalikan dana.');
    const m = getM(c, mid); if (!m || !['DITAHAN', 'DIKIRIM'].includes(m.status)) return err('Termin ini tidak dapat dikembalikan.');
    post(`Pengembalian ${c.no}: ${m.title}`, [{ acc: 'HELD', dr: m.amount }, { acc: 'KAS', cr: m.amount }], c.id);
    m.status = 'DIKEMBALIKAN'; m.refund = m.amount; settle(c);
    audit(user(uid).name, 'Mengembalikan dana ke klien', `${c.no} Rp ${m.amount.toLocaleString('id-ID')}, tanpa potongan`); save(); return ok(m);
  };
  const cancelUnfunded = (uid, cid, mid) => {
    const c = getC(cid); if (!c || (c.clientId !== uid && c.freelancerId !== uid)) return err('Anda bukan pihak kontrak ini.');
    const m = getM(c, mid); if (!m || m.status !== 'BELUM_DANA') return err('Hanya termin yang belum didanai yang dapat dibatalkan.');
    m.status = 'DIKEMBALIKAN'; m.refund = 0; settle(c);
    audit(user(uid).name, 'Membatalkan termin', `${c.no}: ${m.title}`); save(); return ok(m);
  };

  /* ---------- sengketa ---------- */
  const openDispute = (uid, cid, mid, reason) => {
    const c = getC(cid); if (!c || (c.clientId !== uid && c.freelancerId !== uid)) return err('Anda bukan pihak kontrak ini.');
    const m = getM(c, mid); if (!m || !['DITAHAN', 'DIKIRIM'].includes(m.status)) return err('Sengketa hanya untuk termin yang dananya sedang ditahan.');
    if (clean(reason).length < 20) return err('Jelaskan masalahnya minimal 20 huruf.');
    m.prevStatus = m.status; m.status = 'SENGKETA'; c.status = 'SENGKETA';
    const d = { id: id('d'), contractId: cid, msId: mid, by: uid, reason: clean(reason), status: 'TERBUKA', at: now() };
    S.disputes.unshift(d);
    audit(user(uid).name, 'Membuka sengketa', `${c.no}: ${m.title}`); save(); return ok(d);
  };
  const resolveDispute = (admin, did, toFreelancer, note) => {
    const d = S.disputes.find((x) => x.id === did); if (!d || d.status !== 'TERBUKA') return err('Sengketa ini sudah ditutup.');
    const c = getC(d.contractId), m = getM(c, d.msId);
    const a = num(toFreelancer);
    if (a > m.amount) return err('Bagian freelancer melebihi nilai termin.');
    if (clean(note).length < 20) return err('Tulis dasar keputusan minimal 20 huruf. Kedua pihak akan membacanya.');
    const back = m.amount - a;
    if (back > 0) { post(`Pengembalian sengketa ${c.no}: ${m.title}`, [{ acc: 'HELD', dr: back }, { acc: 'KAS', cr: back }], c.id); m.refund = back; }
    if (a > 0) release(c, m, a, admin);
    m.status = a > 0 ? 'CAIR' : 'DIKEMBALIKAN';
    d.status = 'SELESAI'; d.resolution = { toFreelancer: a, toClient: back, note: clean(note), admin, at: now() };
    c.status = 'AKTIF'; settle(c);
    audit(admin, 'Memutus sengketa', `${c.no}: freelancer Rp ${a.toLocaleString('id-ID')}, klien Rp ${back.toLocaleString('id-ID')}`); save(); return ok(d);
  };

  /* ---------- pesan & ulasan ---------- */
  const OFFSITE = /(\+?62|08)[\d\s-]{8,}|wa\.me|whats\s?app|@[a-z0-9.-]+\.[a-z]{2,}|telegram/i;
  const send = (uid, cid, text) => {
    const c = getC(cid); if (!c || (c.clientId !== uid && c.freelancerId !== uid)) return err('Anda bukan pihak kontrak ini.');
    const t = clean(text); if (!t) return err('Tulis pesan terlebih dahulu.');
    const flag = OFFSITE.test(t);
    S.msgs.push({ id: id('s'), thread: cid, from: uid, text: t, at: now(), flag });
    save(); return ok({ flag });
  };
  const review = (uid, cid, stars, text) => {
    const c = getC(cid); if (!c || c.status !== 'SELESAI') return err('Ulasan dibuka setelah kontrak selesai.');
    if (c.clientId !== uid && c.freelancerId !== uid) return err('Anda bukan pihak kontrak ini.');
    if (S.reviews.some((r) => r.contractId === cid && r.from === uid)) return err('Anda sudah memberi ulasan.');
    const s = num(stars); if (s < 1 || s > 5) return err('Pilih 1 sampai 5 bintang.');
    if (clean(text).length < 10) return err('Tulis ulasan minimal 10 huruf.');
    S.reviews.unshift({ id: id('r'), contractId: cid, from: uid, to: uid === c.clientId ? c.freelancerId : c.clientId, stars: s, text: clean(text), at: now() });
    save(); return ok(true);
  };
  const ratingOf = (uid) => {
    const r = S.reviews.filter((x) => x.to === uid);
    return r.length ? { avg: r.reduce((a, x) => a + x.stars, 0) / r.length, n: r.length } : { avg: 0, n: 0 };
  };

  /* ---------- penghasilan & pencairan ---------- */
  const balance = (fid) => {
    const e = S.earnings.filter((x) => x.freelancerId === fid);
    const out = S.payouts.filter((p) => p.freelancerId === fid && p.status !== 'DITOLAK').reduce((a, p) => a + p.amount, 0);
    const total = e.reduce((a, x) => a + x.net, 0) - out;
    const ready = e.filter((x) => x.availableAt <= now()).reduce((a, x) => a + x.net, 0) - out;
    return { total, available: Math.max(0, ready), pending: total - Math.max(0, ready) };
  };
  const requestPayout = (uid, { amount, method, dest }) => {
    const u = user(uid), a = num(amount), bal = balance(uid);
    const member = isMember(u);
    if (u.status !== 'AKTIF') return err('Akun Anda sedang ditangguhkan.');
    if (u.kyc !== 'TERVERIFIKASI') return err('Verifikasi identitas dahulu sebelum mencairkan dana.');
    if (a < pol().minPayout) return err(`Pencairan minimal Rp ${pol().minPayout.toLocaleString('id-ID')}.`);
    if (a > bal.available) return err(`Saldo siap cair Rp ${bal.available.toLocaleString('id-ID')}.`);
    if (method === 'DOMPET' && !member) return err('Dompet ARIBA hanya untuk anggota koperasi.');
    if (method === 'BANK' && clean(dest).length < 6) return err('Isi bank dan nomor rekening tujuan.');
    const fee = method === 'DOMPET' ? 0 : (member ? pol().payoutFeeMember : pol().payoutFeePublic);
    if (a <= fee) return err('Nominal harus lebih besar dari biaya transfer.');
    const p = { id: id('w'), freelancerId: uid, amount: a, fee, method, dest: method === 'DOMPET' ? `Dompet ARIBA ${u.member.no}` : clean(dest), status: 'DIAJUKAN', at: now() };
    S.payouts.unshift(p);
    post(`Pengajuan pencairan ${u.name}`, [{ acc: 'SALDO', dr: a }, { acc: 'PAYOUT', cr: a }], p.id);
    audit(u.name, 'Mengajukan pencairan', `Rp ${a.toLocaleString('id-ID')} ke ${p.dest}`);
    if (method === 'DOMPET') payPayout('Sistem', p.id); else save();
    return ok(p);
  };
  const payPayout = (admin, pid) => {
    const p = S.payouts.find((x) => x.id === pid); if (!p || p.status !== 'DIAJUKAN') return err('Pencairan ini sudah diproses.');
    p.status = 'DIBAYAR'; p.paidAt = now(); p.paidBy = admin;
    post(`Pembayaran pencairan ${user(p.freelancerId).name}`, [{ acc: 'PAYOUT', dr: p.amount }, { acc: 'KAS', cr: p.amount - p.fee }, { acc: 'FEE', cr: p.fee }], p.id);
    audit(admin, 'Membayar pencairan', `${user(p.freelancerId).name} Rp ${(p.amount - p.fee).toLocaleString('id-ID')} ke ${p.dest}`); save(); return ok(p);
  };
  const rejectPayout = (admin, pid, reason) => {
    const p = S.payouts.find((x) => x.id === pid); if (!p || p.status !== 'DIAJUKAN') return err('Pencairan ini sudah diproses.');
    if (clean(reason).length < 10) return err('Tulis alasan penolakan, minimal 10 huruf.');
    p.status = 'DITOLAK'; p.reason = clean(reason);
    post(`Penolakan pencairan ${user(p.freelancerId).name}`, [{ acc: 'PAYOUT', dr: p.amount }, { acc: 'SALDO', cr: p.amount }], p.id);
    audit(admin, 'Menolak pencairan', `${user(p.freelancerId).name}: ${reason}`); save(); return ok(p);
  };

  /* ---------- jasa siap pesan ---------- */
  const postService = (uid, s) => {
    const u = user(uid), title = clean(s.title), desc = clean(s.desc);
    if (title.length < 10) return err('Judul jasa minimal 10 huruf.');
    if (desc.length < 30) return err('Deskripsi minimal 30 huruf.');
    const tiers = [['Dasar', s.p1, s.d1, s.s1], ['Standar', s.p2, s.d2, s.s2], ['Lengkap', s.p3, s.d3, s.s3]]

function shell(active, body) {

  const L = F ? [['ruang', 'Ringkasan'], ['kontrak', 'Kontrak'], ['proposal', 'Proposal'], ['jasa-saya', 'Jasa saya'], ['pesan', 'Pesan'], ['penghasilan', 'Penghasilan'], ['profil', 'Profil']]

  return `<div class="sub"><div class="wrap">${L.map(([h, t]) => `<a href="#${h}" class="${active === h ? 'on' : ''}">${t}</a>`).join('')}</div></div><div class="wrap page stack">${body}</div>`;
}
const myContracts = (u) => NK.S.contracts.filter((c) => c.clientId === u.id || c.freelancerId === u.id);
const other = (c, u) => NK.user(c.clientId === u.id ? c.freelancerId : c.clientId);
const contractRow = (c, u) => { const paid = c.milestones.filter((m) => m.status === 'CAIR').length; return `<a class="card row between" href="#kontrak-${c.id}"><div class="grow"><div class="mono muted">${c.no}</div><strong style="color:var(--navy)">${esc(c.title)}</strong><div class="muted small">${esc(other(c, u).name)} · ${paid}/${c.milestones.length} termin selesai</div></div><div style="text-align:right"><div class="price">${rp(c.total)}</div>${pill(c.status)}</div></a>`; };
function todo(u) {
  const out = [];
  myContracts(u).forEach((c) => c.milestones.forEach((m) => {
    const link = `<a href="#kontrak-${c.id}">${esc(c.no)}</a>`;
    if (u.id === c.clientId && m.status === 'BELUM_DANA' && c.status === 'AKTIF') { out.push(['warn', `Danai termin "${esc(m.title)}" ${link}`]); }
    if (u.id === c.clientId && m.status === 'DIKIRIM') { const left = Math.max(0, NK.pol().autoReleaseDays - Math.floor((NK.now() - m.submittedAt) / NK.DAY)); out.push(['warn', `Tinjau hasil "${esc(m.title)}" ${link}. Cair otomatis dalam ${left} hari.`]); }
    if (u.id === c.freelancerId && m.status === 'DITAHAN') out.push(['sea', `Kerjakan dan kirim "${esc(m.title)}" ${link}`]);
    if (m.status === 'SENGKETA') out.push(['bad', `Sengketa sedang ditinjau pengelola ${link}`]);
  }));
  NK.S.contracts.filter((c) => c.status === 'SELESAI' && (c.clientId === u.id || c.freelancerId === u.id) && !NK.S.reviews.some((r) => r.contractId === c.id && r.from === u.id)).forEach((c) => out.push(['', `Beri ulasan untuk <a href="#kontrak-${c.id}">${esc(c.no)}</a>`]));
  NK.S.invites.filter((i) => i.freelancerId === u.id && !NK.S.proposals.some((p) => p.jobId === i.jobId && p.freelancerId === u.id)).forEach((i) => { const j = NK.S.jobs.find((x) => x.id === i.jobId); if (j && j.status === 'TERBUKA') out.push(['sea', `${esc(NK.user(i.clientId).name)} mengundang Anda ke <a href="#lowongan-${j.id}">${esc(j.title)}</a>`]); });
  return out;
}

function vContracts() {

function vContract(id) {
  const u = NK.me(), c = NK.getC(id);
  if (!u) return vLogin();

  const cl = NK.user(c.clientId), fr = NK.user(c.freelancerId), isC = u.id === c.clientId, isF = u.id === c.freelancerId;
  const pct = c.commissionBps / 100, x = { amount: c.total, komisi: NK.commissionOf(c.total, c.commissionBps) };
  const msgs = NK.S.msgs.filter((m) => m.thread === c.id);
  const reviewed = NK.S.reviews.some((r) => r.contractId === c.id && r.from === u.id);
  const refunds = c.milestones.reduce((a, m) => a + (m.refund || 0), 0);
  const body = `<div><div class="crumb"><a href="#${u.role === 'ADMIN' ? 'admin-kontrak' : 'kontrak'}">Kontrak</a> / <span class="mono">${c.no}</span></div><h1 class="title">${esc(c.title)}</h1><div class="row small muted" style="margin-top:6px">${pill(c.status)}<span>Klien ${esc(cl.name)}</span><span>Freelancer <a href="#talenta-${fr.id}">${esc(fr.name)}</a></span></div></div>
  <div class="split"><div class="stack"><div><h2 style="font-size:22px;margin-bottom:8px">Termin</h2>${c.milestones.map((m) => msRow(c, m, isC, isF)).join('')}</div>
    ${c.status === 'SELESAI' && (isC || isF) && !reviewed ? `<form class="card stack-s" data-f="review" data-id="${c.id}"><h3>Beri ulasan untuk ${esc(other(c, u).name)}</h3><div class="fgrid"><label class="f">Nilai<select class="in" id="rv-s" name="stars">${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${'★'.repeat(n)}</option>`).join('')}</select></label></div><label class="f">Ulasan<textarea class="in" id="rv-t" name="text"></textarea></label><button class="btn pri">Kirim ulasan</button></form>` : ''}
    <div class="card stack-s"><h3>Pesan</h3><div class="thread">${msgs.length ? msgs.map((m) => `<div class="bub ${m.from === u.id ? 'mine' : ''}">${esc(m.text)}<small>${esc(NK.user(m.from).name)} · ${ago(m.at)}${m.flag ? ' · ditandai ARIBA-NK-006' : ''}</small></div>`).join('') : '<p class="muted small">Belum ada pesan.</p>'}</div>
    ${isC || isF ? `<form class="row" data-f="msg" data-id="${c.id}" style="flex-wrap:nowrap"><input class="in grow" id="msg-t" name="text" placeholder="Tulis pesan" aria-label="Tulis pesan"><button class="btn">Kirim</button></form>` : ''}</div></div>
  <aside class="stack"><div class="nota" style="box-shadow:none;border:1px solid var(--line)"><div class="no">NOTA KONTRAK ${c.no}</div><div class="lines"><div><span>Nilai kontrak</span><span>${rp(c.total)}</span></div>${isC ? '<div><span>Biaya untuk klien</span><span>Rp&nbsp;0</span></div>' : `<div><span>Komisi ${String(pct).replace('.', ',')}%</span><span>−${rp(x.komisi)}</span></div><div class="t"><span>Freelancer terima</span><span>${rp(c.total - x.komisi)}</span></div>`}${refunds ? `<div><span>Dikembalikan ke klien</span><span>${rp(refunds)}</span></div>` : ''}</div><p class="muted xs" style="margin-top:8px">Komisi dikunci dari kebijakan versi ${c.policyVersion}. Tanpa bunga dan denda.</p></div></aside></div>`;
  return u.role === 'ADMIN' ? `<div class="wrap page stack">${body}</div>` : shell('kontrak', body);
}
function msRow(c, m, isC, isF) {
  const B = [];
  const d = `data-c="${c.id}" data-m="${m.id}"`;
  if (isC && m.status === 'BELUM_DANA') { B.push(`<button class="btn pri s" data-a="fund" ${d}>Danai ${rp(m.amount)}</button>`); B.push(`<button class="btn s" data-a="cancelM" ${d}>Batalkan termin</button>`); }
  if (isF && m.status === 'DITAHAN') { B.push(`<button class="btn pri s" data-a="submit" ${d}>Kirim hasil</button>`); B.push(`<button class="btn s" data-a="refund" ${d}>Kembalikan dana</button>`); }
  if (isC && m.status === 'DIKIRIM') { B.push(`<button class="btn pri s" data-a="approve" ${d}>Setujui dan cairkan</button>`); B.push(`<button class="btn s" data-a="revise" ${d}>Minta revisi</button>`); }
  if ((isC || isF) && ['DITAHAN', 'DIKIRIM'].includes(m.status)) B.push(`<button class="btn s danger" data-a="dispute" ${d}>Buka sengketa</button>`);
  const left = m.status === 'DIKIRIM' ? Math.max(0, NK.pol().autoReleaseDays - Math.floor((NK.now() - m.submittedAt) / NK.DAY)) : 0;
  const dp = NK.S.disputes.find((x) => x.msId === m.id);
  return `<div class="ms stack-s"><div class="row between"><strong>${esc(m.title)}</strong><span class="price">${rp(m.amount)}</span></div><div>${pill(m.status)}${m.revisions ? ` <span class="muted xs">${m.revisions} kali revisi</span>` : ''}</div>
  ${m.revisionNote && m.status === 'DITAHAN' ? `<div class="note warn">Permintaan revisi: ${esc(m.revisionNote)}</div>` : ''}${m.note && m.status !== 'DITAHAN' ? `<p class="small muted">Hasil: ${esc(m.note)}</p>` : ''}
  ${m.status === 'DIKIRIM' ? `<p class="xs muted">Cair otomatis dalam ${left} hari bila klien tidak merespons.</p>` : ''}${m.status === 'CAIR' ? `<p class="xs muted num">Cair ${tgl(m.paidAt)} · komisi ${rp(m.komisi)} · diterima freelancer ${rp(m.net)}</p>` : ''}
  ${dp ? `<div class="note ${dp.status === 'TERBUKA' ? 'bad' : ''}"><strong>Sengketa:</strong> ${esc(dp.reason)}${dp.resolution ? `<br><strong>Putusan:</strong> ${esc(dp.resolution.note)} (freelancer ${rp(dp.resolution.toFreelancer)}, klien ${rp(dp.resolution.toClient)})` : ''}</div>` : ''}
  ${B.length ? `<div class="row">${B.join('')}</div>` : ''}</div>`;
}

/* ---------- aksi ---------- */
const form = (title, intro, fields, label, f, attrs = '') => modal(`<h3>${title}</h3>${intro ? `<p class="muted small">${intro}</p>` : ''}<form class="stack" data-f="${f}" ${attrs}>${fields}<div class="row"><button class="btn pri">${label}</button><button type="button" class="btn" data-a="close">Batal</button></div></form>`);
const A = {
  burger() { $('#nav').classList.toggle('open'); },
  close: closeModal,
  reset() { modal(`<h3>Mulai ulang data contoh?</h3><p class="muted small">Semua perubahan di peramban ini akan hilang.</p><div class="row"><button class="btn pri" data-a="resetYes">Mulai ulang</button><button class="btn" data-a="close">Batal</button></div>`); },
  resetYes() { NK.reset(); closeModal(); toast('Data contoh dimulai ulang.'); go('beranda'); },
  login(d) { NK.login(d.id); const u = NK.me(); toast('Masuk sebagai ' + u.name); go(u.role === 'ADMIN' ? 'admin' : 'ruang'); },
  logout() { NK.logout(); toast('Anda sudah keluar.'); go('beranda'); },
  kyc() { done(NK.requestKyc(NK.me().id), 'Identitas terkirim. Pengelola akan meninjau.'); },
  closeJob(d) { done(NK.closeJob(NK.me().id, d.id), 'Lowongan ditutup.'); },
  rejectP(d) { done(NK.rejectProposal(NK.me().id, d.id), 'Proposal ditolak.'); },
  withdrawP(d) { done(NK.withdrawProposal(NK.me().id, d.id), 'Proposal ditarik.'); },
  accept(d) {
    const p = NK.S.proposals.find((x) => x.id === d.id), half = Math.floor(p.price / 2 / 1000) * 1000;
    const row = (i, t, a) => `<div class="fgrid"><label class="f">Termin ${i} (hasil)<input class="in" id="ac-t${i}" name="t${i}" value="${esc(t)}"></label><label class="f">Nominal<input class="in num" id="ac-a${i}" name="a${i}" inputmode="numeric" value="${a}"></label></div>`;
    form('Buat kontrak', `Bagi ${rp(p.price)} menjadi termin. Total harus tepat sama. Kosongkan termin yang tidak dipakai.`, row(1, 'Tahap pertama', half) + row(2, 'Tahap akhir dan serah terima', p.price - half) + row(3, '', ''), 'Buat kontrak', 'accept', `data-id="${d.id}"`);
  },
  order(d) {
    if (!need('K')) return;
    const r = NK.orderService(NK.me().id, d.id, Number(d.t)); if (done(r, 'Pesanan dibuat. Danai untuk memulai.', 'kontrak-' + (r.value || {}).id)) { /* selesai */ }
  },
  fund(d) {
    const c = NK.getC(d.c), m = c.milestones.find((x) => x.id === d.m);
    modal(`<h3>Danai termin</h3><div class="lines"><div><span>${esc(m.title)}</span><span>${rp(m.amount)}</span></div><div><span>Biaya untuk klien</span><span>Rp&nbsp;0</span></div><div class="t"><span>Total bayar</span><span>${rp(m.amount)}</span></div></div>
    <form class="stack" data-f="fund" data-c="${d.c}" data-m="${d.m}">${['QRIS', 'VA BCA', 'VA BRI', 'VA Mandiri', 'Dompet digital'].map((x, i) => `<label class="choice"><input type="radio" name="method" value="${x}" ${i ? '' : 'checked'}><span>${x}</span></label>`).join('')}<div class="note warn">Simulasi. Tidak ada pembayaran sungguhan.</div><div class="row"><button class="btn pri">Simulasikan pembayaran berhasil</button><button type="button" class="btn" data-a="close">Batal</button></div></form>`);
  },
  submit(d) { form('Kirim hasil kerja', 'Jelaskan hasilnya dan tautan berkas bila ada.', '<label class="f">Keterangan hasil<textarea class="in" id="sb-n" name="note"></textarea></label>', 'Kirim hasil', 'submit', `data-c="${d.c}" data-m="${d.m}"`); },
  revise(d) { form('Minta revisi', '', '<label class="f">Bagian yang perlu diperbaiki<textarea class="in" id="rv-n" name="note"></textarea></label>', 'Kirim permintaan', 'revise', `data-c="${d.c}" data-m="${d.m}"`); },
  dispute(d) { form('Buka sengketa', 'Dana termin tetap ditahan sampai pengelola memutus.', '<label class="f">Apa masalahnya?<textarea class="in" id="dp-n" name="reason"></textarea></label>', 'Buka sengketa', 'dispute', `data-c="${d.c}" data-m="${d.m}"`); },
  approve(d) {
    const c = NK.getC(d.c), m = c.milestones.find((x) => x.id === d.m), k = NK.commissionOf(m.amount, c.commissionBps);
    modal(`<h3>Setujui dan cairkan?</h3><div class="lines"><div><span>Nilai termin</span><span>${rp(m.amount)}</span></div><div><span>Komisi Narakarya</span><span>−${rp(k)}</span></div><div class="t"><span>Diterima freelancer</span><span>${rp(m.amount - k)}</span></div></div><p class="muted small">Pencairan tidak dapat dibatalkan.</p><div class="row"><button class="btn pri" data-a="approveYes" data-c="${d.c}" data-m="${d.m}">Setujui dan cairkan</button><button class="btn" data-a="close">Batal</button></div>`);
  },
  approveYes(d) { done(NK.approve(NK.me().id, d.c, d.m), 'Dana cair ke freelancer.'); },
  refund(d) { modal(`<h3>Kembalikan dana ke klien?</h3><p class="muted small">Dana kembali utuh tanpa potongan dan komisi tidak dikenakan.</p><div class="row"><button class="btn danger" data-a="refundYes" data-c="${d.c}" data-m="${d.m}">Kembalikan dana</button><button class="btn" data-a="close">Batal</button></div>`); },
  refundYes(d) { done(NK.refundByFreelancer(NK.me().id, d.c, d.m), 'Dana dikembalikan ke klien.'); },
  cancelM(d) { done(NK.cancelUnfunded(NK.me().id, d.c, d.m), 'Termin dibatalkan.'); },
  payout() {
    const u = NK.me(), b = NK.balance(u.id), P = NK.pol(), m = NK.isMember(u);

const Fm = {
  noop() {},
  hsearch(v) { filt = { ...filt, q: v.q || '', cat: '', member: false, budget: 0 }; go(v.t); },
  filter(v) { filt = { ...filt, q: v.q || '', cat: v.cat || '', member: !!v.member, budget: Number(v.budget) || 0 }; render(); },
  register(v) { const r = NK.register(v); if (done(r, 'Akun dibuat.', 'ruang')) { /* selesai */ } },
  apply(v, el) { const u = need('F'); if (u) done(NK.propose(u.id, el.dataset.id, v), 'Proposal terkirim.'); },
  accept(v, el) { const r = NK.acceptProposal(NK.me().id, el.dataset.id, [1, 2, 3].map((i) => ({ title: v['t' + i], amount: v['a' + i] }))); done(r, 'Kontrak dibuat. Danai termin pertama.', r.ok ? 'kontrak-' + r.value.id : null); },
  fund(v, el) { done(NK.fund(NK.me().id, el.dataset.c, el.dataset.m, v.method), 'Dana ditahan aman sampai hasil disetujui.'); },
  submit(v, el) { done(NK.submitWork(NK.me().id, el.dataset.c, el.dataset.m, v.note), 'Hasil dikirim ke klien.'); },
  revise(v, el) { done(NK.askRevision(NK.me().id, el.dataset.c, el.dataset.m, v.note), 'Permintaan revisi terkirim.'); },
  dispute(v, el) { done(NK.openDispute(NK.me().id, el.dataset.c, el.dataset.m, v.reason), 'Sengketa dibuka. Pengelola akan meninjau.'); },
  msg(v, el) { const r = NK.send(NK.me().id, el.dataset.id, v.text); if (r.ok && r.value.flag) { toast('Pesan terkirim dan ditandai: jaga transaksi tetap di Narakarya (ARIBA-NK-006).'); render(); } else done(r); },
  review(v, el) { done(NK.review(NK.me().id, el.dataset.id, v.stars, v.text), 'Ulasan terkirim.'); },
  postJob(v) { const r = NK.postJob(NK.me().id, v); done(r, r.ok && r.value.status === 'TERBUKA' ? 'Lowongan tayang.' : 'Lowongan dikirim untuk ditinjau.', r.ok ? 'lowongan-saya' : null); },
  postService(v) { const r = NK.postService(NK.me().id, v); done(r, r.ok && r.value.status === 'TAYANG' ? 'Jasa tayang.' : 'Jasa dikirim untuk ditinjau.'); },
  profile(v) { done(NK.saveProfile(NK.me().id, v), 'Profil disimpan.'); },
  payout(v) { done(NK.requestPayout(NK.me().id, v), v.method === 'DOMPET' ? 'Dana masuk ke Dompet ARIBA (simulasi).' : 'Pengajuan pencairan terkirim.'); },
  invite(v, el) { done(NK.invite(NK.me().id, v.job, el.dataset.id), 'Undangan terkirim.'); },
};

function render() {
  const raw = (location.hash || '#beranda').slice(1) || 'beranda';
  const [r, ...rest] = raw.split('-'); const arg = rest.join('-');
  const u = NK.me();
  const authed = (fn, kind) => { if (!u) return vLogin(); if (kind && u.kind !== kind) return `<div class="wrap page">${empty('Halaman ini untuk jenis akun lain', '<a href="#ruang">Kembali ke ruang kerja</a>')}</div>`; return fn(); };
  let html;
  if (r === 'admin') html = vAdmin(arg);
  else if (r === 'beranda') html = vHome();
  else if (r === 'lowongan') html = arg === 'saya' ? authed(vMyJobs, 'K') : (arg ? vJob(arg) : vJobs());
  else if (r === 'talenta') html = arg ? vTalent(arg) : vTalents();
  else if (r === 'jasa') html = arg === 'saya' ? authed(vMyServices, 'F') : (arg ? vService(arg) : vServices());
  else if (r === 'biaya') html = vPricing();
  else if (r === 'aturan') html = vRules();
  else if (r === 'masuk') html = vLogin();
  else if (r === 'daftar') html = vRegister();
  else if (r === 'ruang') html = authed(vDash);
  else if (r === 'kontrak') html = authed(() => (arg ? vContract(arg) : vContracts()));
  else if (r === 'proposal') html = authed(vProposals, 'F');
  else if (r === 'pasang') html = authed(vPost, 'K');
  else if (r === 'pesan') html = authed(vInbox);
  else if (r === 'penghasilan') html = authed(vEarn, 'F');
  else if (r === 'pembayaran') html = authed(vPaid, 'K');
  else if (r === 'profil') html = authed(vProfile, 'F');
  else html = `<div class="wrap page">${empty('Halaman tidak ditemukan', '<a href="#beranda">Kembali ke beranda</a>')}</div>`;
  $('#app').innerHTML = header(r) + `<main>${html}</main>` + footer();
  if (raw !== currentRoute) { window.scrollTo(0, 0); currentRoute = raw; }
}

const monthKey = (t) => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
const monthName = (k) => new Date(Math.floor(k / 12), k % 12, 1).toLocaleDateString('id-ID', { month: 'short' });
const ADMIN_NAME = 'Pengelola Ariba Indonesia';

function barChart(rows) {
  const W = 620, H = 220, L = 58, B = 26, T = 18;
  const max = Math.max(...rows.map((r) => r.v), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const nice = Math.ceil(max / step) * step;
  const sc = (v) => (H - B - T) * (v / nice);
  const bw = (W - L - 8) / rows.length;
  const ticks = [0, 0.5, 1].map((f) => f * nice);
  const short = (v) => (v >= 1e6 ? (v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : v >= 1e3 ? (v / 1e3).toLocaleString('id-ID') + ' rb' : '0');
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Komisi per bulan" style="width:100%;height:auto;display:block">
  ${ticks.map((t) => `<line x1="${L}" x2="${W}" y1="${H - B - sc(t)}" y2="${H - B - sc(t)}" stroke="#E2DDD3"/><text x="${L - 8}" y="${H - B - sc(t) + 4}" text-anchor="end">${short(t)}</text>`).join('')}
  ${rows.map((r, i) => { const h = sc(r.v), x = L + i * bw + bw * 0.2, last = i === rows.length - 1; return `<rect x="${x}" y="${H - B - h}" width="${bw * 0.6}" height="${h}" rx="2" fill="${last ? '#7E293C' : '#4A6175'}"><title>${r.l}: ${rp(r.v)}</title></rect><text x="${x + bw * 0.3}" y="${H - 8}" text-anchor="middle">${r.l}</text>${r.v ? `<text x="${x + bw * 0.3}" y="${H - B - h - 5}" text-anchor="middle">${short(r.v)}</text>` : ''}`; }).join('')}</svg>`;
}

  <h2 style="font-size:22px">Antrean pencairan</h2>${Q.length ? `<div class="tw"><table class="tmin"><thead><tr><th>Diajukan</th><th>Freelancer</th><th>Tujuan</th><th class="r">Nominal</th><th class="r">Biaya</th><th class="r">Ditransfer</th><th></th></tr></thead><tbody>${Q.map((p) => `<tr><td>${ago(p.at)}</td><td>${esc(NK.user(p.freelancerId).name)}</td><td class="small">${esc(p.dest)}</td><td class="r">${rp(p.amount)}</td><td class="r">${rp(p.fee)}</td><td class="r"><strong>${rp(p.amount - p.fee)}</strong></td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sea s" data-a="payYes" data-id="${p.id}">Bayar</button><button class="btn danger s" data-a="payNo" data-id="${p.id}">Tolak</button></div></td></tr>`).join('')}</tbody></table></div>` : empty('Tidak ada pencairan yang menunggu')}
  <h2 style="font-size:22px">Saldo buku</h2><div class="tw"><table><thead><tr><th>Akun</th><th class="r">Saldo</th></tr></thead><tbody>${accs.map((a) => `<tr><td>${esc(a.n)}</td><td class="r">${rp(Math.abs(a.v))}</td></tr>`).join('')}<tr><td><strong>Total debit sama dengan total kredit</strong></td><td class="r"><strong>${rc.dr === rc.cr ? 'Seimbang' : 'Selisih'} · ${rp(rc.dr)}</strong></td></tr></tbody></table></div>
  <h2 style="font-size:22px">Jurnal terbaru</h2><div class="tw"><table class="tmin"><thead><tr><th>Waktu</th><th>Keterangan</th><th>Rincian</th></tr></thead><tbody>${S.ledger.slice(0, 20).map((j) => `<tr><td class="small" style="white-space:nowrap">${tgl(j.at)}</td><td>${esc(j.memo)}</td><td class="xs num">${j.lines.map((l) => `<div>${l.dr ? 'Dr' : 'Cr'} ${esc(NK.ACC[l.acc].split(' ').slice(1).join(' '))} ${rp(l.dr || l.cr)}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`;
}
function aPolicy() {
  const P = NK.pol();
  const f = (id, l, h = '') => `<label class="f">${l}${h ? `<small>${h}</small>` : ''}<input class="in num" id="pl-${id}" name="${id}" value="${P[id]}" inputmode="numeric"></label>`;
  return `<h1 class="title">Kebijakan</h1><p class="muted small">Versi ${P.version}. Perubahan hanya berlaku untuk kontrak baru dan tercatat di Audit.</p>
  <form class="stack" data-f="policy" style="max-width:820px"><div class="card stack"><h3>Komisi</h3><div class="fgrid">${f('commissionPct', 'Komisi Ariba Indonesia (%)', 'Dipotong dari penghasilan freelancer')}</div></div>
  <div class="card stack"><h3>Akun umum dan anggota</h3><div class="fgrid">${f('quotaPublic', 'Kuota lamaran umum')}${f('quotaMember', 'Kuota lamaran anggota')}${f('holdDaysPublic', 'Masa tunggu umum (hari)')}${f('holdDaysMember', 'Masa tunggu anggota (hari)')}${f('payoutFeePublic', 'Biaya pencairan umum (Rp)')}${f('payoutFeeMember', 'Biaya pencairan anggota (Rp)')}</div></div>
  <div class="card stack"><h3>Kontrak dan pencairan</h3><div class="fgrid">${f('autoReleaseDays', 'Pencairan otomatis (hari)', 'Bila klien tidak merespons')}${f('minMilestone', 'Nilai termin minimal (Rp)')}${f('minPayout', 'Pencairan minimal (Rp)')}</div></div>
  <div class="card stack"><h3>Penyaringan isi (ARIBA-NK-003)</h3><label class="f">Kata diblokir<small>Pisahkan dengan koma. Lowongan dan jasa ditolak otomatis.</small><textarea class="in" id="pl-blocked" name="blocked">${esc(P.blocked.join(', '))}</textarea></label><label class="f">Kata ditinjau<small>Ditahan untuk ditinjau pengelola, termasuk dari anggota.</small><textarea class="in" id="pl-review" name="review">${esc(P.review.join(', '))}</textarea></label></div>
  <div class="row"><button class="btn pri">Simpan sebagai versi ${P.version + 1}</button></div></form>`;
}
function aAudit() {
  return `<h1 class="title">Audit</h1><p class="muted small">Setiap tindakan penting tercatat dan tidak dapat diubah dari aplikasi.</p><div class="tw"><table class="tmin"><thead><tr><th>Waktu</th><th>Pelaku</th><th>Tindakan</th><th>Rincian</th></tr></thead><tbody>${NK.S.audit.slice(0, 80).map((a) => `<tr><td class="small" style="white-space:nowrap">${tgl(a.at)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td class="small muted">${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}
function vAdmin(tab) {
  const u = NK.me();
  if (!u || u.role !== 'ADMIN') return `<div class="wrap page" style="max-width:560px"><div class="stack"><div><h1 class="title">Dashboard pengelola</h1><p class="muted">Khusus tim Ariba Indonesia.</p></div><button class="persona" data-a="login" data-id="admin">${av(NK.user('admin'))}<span class="grow"><strong>Masuk sebagai pengelola</strong><br><span class="muted small">Akun contoh. Versi tayang memakai login dua langkah.</span></span></button></div></div>`;
  const c = adminCounts(), t = tab || 'ringkasan';
  const N = [['ringkasan', 'Ringkasan', 'home', 0], ['moderasi', 'Moderasi', 'flag', c.moderasi], ['verifikasi', 'Verifikasi', 'shield', c.verifikasi], ['pengguna', 'Pengguna', 'users', 0], ['kontrak', 'Kontrak', 'file', 0], ['sengketa', 'Sengketa', 'scale', c.sengketa], ['keuangan', 'Keuangan', 'wallet', c.pencairan], ['kebijakan', 'Kebijakan', 'sliders', 0], ['audit', 'Audit', 'list', 0]];
  const V = { ringkasan: aOverview, moderasi: aModeration, verifikasi: aVerify, pengguna: aUsers, kontrak: aContracts, sengketa: aDisputes, keuangan: aFinance, kebijakan: aPolicy, audit: aAudit };
  return `<div class="adm"><nav class="adm-side" aria-label="Menu pengelola">${N.map(([h, l, i, n]) => `<a href="#admin${h === 'ringkasan' ? '' : '-' + h}" class="${t === h ? 'on' : ''}">${ic(i)}${l}${n ? `<em>${n}</em>` : ''}</a>`).join('')}</nav><div class="adm-main">${(V[t] || aOverview)()}</div></div>`;
}
const AA = {
  modOk(d) { done(d.t === 'Jasa' ? NK.moderateService(ADMIN_NAME, d.id, true, '') : NK.moderateJob(ADMIN_NAME, d.id, true, ''), 'Disetujui dan tayang.'); },
  modNo(d) { form('Tolak dari tayangan', 'Alasan akan terlihat oleh pemiliknya.', '<label class="f">Alasan penolakan<textarea class="in" id="md-r" name="reason"></textarea></label>', 'Tolak', 'modNo', `data-t="${d.t}" data-id="${d.id}"`); },
  kycOk(d) { done(NK.reviewKyc(ADMIN_NAME, d.id, true, ''), 'Identitas terverifikasi.'); },
  kycNo(d) { form('Tolak identitas', '', '<label class="f">Alasan penolakan<textarea class="in" id="ky-r" name="reason"></textarea></label>', 'Tolak', 'kycNo', `data-id="${d.id}"`); },
  suspend(d) { form('Tangguhkan akun', `${esc(NK.user(d.id).name)} tidak dapat melamar, memasang, atau mencairkan dana.`, '<label class="f">Alasan<textarea class="in" id="su-r" name="reason"></textarea></label>', 'Tangguhkan', 'suspend', `data-id="${d.id}"`); },
  unsuspend(d) { done(NK.setUserStatus(ADMIN_NAME, d.id, 'AKTIF', ''), 'Akun diaktifkan.'); },
  resolve(d) {
    const x = NK.S.disputes.find((y) => y.id === d.id), c = NK.getC(x.contractId), m = c.milestones.find((y) => y.id === x.msId);
    form('Putuskan sengketa', `Nilai termin ${rp(m.amount)}. Sisanya kembali ke klien tanpa potongan. Komisi hanya dihitung dari bagian freelancer.`, `<label class="f">Bagian freelancer (Rp)<input class="in num" id="rs-a" name="amount" inputmode="numeric" value="${Math.floor(m.amount / 2)}"></label><label class="f">Dasar keputusan<small>Kedua pihak akan membacanya.</small><textarea class="in" id="rs-n" name="note"></textarea></label>`, 'Tetapkan putusan', 'resolve', `data-id="${d.id}"`);
  },
  payYes(d) { done(NK.payPayout(ADMIN_NAME, d.id), 'Pencairan dibayar (simulasi).'); },
  payNo(d) { form('Tolak pencairan', 'Dana kembali ke saldo freelancer.', '<label class="f">Alasan<textarea class="in" id="pn-r" name="reason"></textarea></label>', 'Tolak', 'payNo', `data-id="${d.id}"`); },
};
const FA = {
  modNo(v, el) { done(el.dataset.t === 'Jasa' ? NK.moderateService(ADMIN_NAME, el.dataset.id, false, v.reason) : NK.moderateJob(ADMIN_NAME, el.dataset.id, false, v.reason), 'Ditolak.'); },
  kycNo(v, el) { done(NK.reviewKyc(ADMIN_NAME, el.dataset.id, false, v.reason), 'Identitas ditolak.'); },
  suspend(v, el) { done(NK.setUserStatus(ADMIN_NAME, el.dataset.id, 'DITANGGUHKAN', v.reason), 'Akun ditangguhkan.'); },
  resolve(v, el) { done(NK.resolveDispute(ADMIN_NAME, el.dataset.id, v.amount, v.note), 'Sengketa diputus.'); },
  payNo(v, el) { done(NK.rejectPayout(ADMIN_NAME, el.dataset.id, v.reason), 'Pencairan ditolak.'); },
  policy(v) { done(NK.setPolicy(ADMIN_NAME, v), 'Kebijakan baru tersimpan.'); },
};
NK.load();
render();

</script>
</body>
</html>
